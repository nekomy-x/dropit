[package]
name = "dropit-gateway-api"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dropit-api"
path = "src/main.rs"

[dependencies]
dropit-common = { path = "../common" }
dropit-domain = { path = "../domain" }
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true
dropit-infra-db = { path = "../infra-db" }
dropit-infra-redis = { path = "../infra-redis" }
dropit-infra-stripe = { path = "../infra-stripe" }
dropit-infra-catalog = { path = "../infra-catalog" }
dropit-infra-mail = { path = "../infra-mail" }
sqlx.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
totp-rs.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
# Рантайм-зависимость: Developer API отдаёт свой OpenAPI (YAML → JSON)
# и фильтрует операции по скоупам ключа (ADR-010).
serde_yaml = "0.9"
hex.workspace = true
rand.workspace = true

[dev-dependencies]
# Контрактный тест openapi_contract читает docs/openapi.yaml как текст и
# разбираёт его в serde_json::Value. serde_yaml — только для тестов, в
# рантайме бинарника не участвует (контракт не ходит в БД/сеть).
serde_yaml = "0.9"
