[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/domain",
    "crates/infra-db",
    "crates/gateway-api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = { version = "0.4", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
argon2 = "0.5"
jsonwebtoken = "9"
totp-rs = { version = "5", features = ["gen_secret"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
async-trait = "0.1"
chrono-tz = "0.9"
aes-gcm = "0.10"

[profile.release]
lto = true
codegen-units = 1
