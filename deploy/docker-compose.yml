# DROP IT local environment (F0A).
# Только Postgres + Redis: NATS добавляется в F5 (ADR-002),
# Stripe — после закрытия ADR-004/Q11–Q13. Никаких production-значений.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropit
      POSTGRES_PASSWORD: dropit_local
      POSTGRES_DB: dropit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropit -d dropit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
