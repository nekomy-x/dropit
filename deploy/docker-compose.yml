# DROP IT local environment — стенд, приближённый к прод-топологии.
#
# Сервисы: Postgres, Redis, NATS (JetStream), API, workers.
# Внешние интеграции (Stripe, push) выключены по умолчанию: их переменные
# пусты — приложение поднимается на mock/noop и остаётся работоспособным.
# Реальные ключи задаются через deploy/.env (не коммитится, см. .env.example).
#
# Запуск:  docker compose -f deploy/docker-compose.yml up -d
# Логи:    docker compose -f deploy/docker-compose.yml logs -f api workers
# Миграции: применяются воркером при DROPIT_RUN_MIGRATIONS=true (см. ниже);
#           для детерминированного порядка — вручную (см. IMPLEMENTATION_STATUS.md).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dropit
      POSTGRES_PASSWORD: dropit_local
      POSTGRES_DB: dropit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dropit -d dropit"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # NATS с JetStream. Мониторинг на 8222 — нужен healthcheck.
  nats:
    image: nats:2-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "4222:4222"   # клиентский протокол
      - "8222:8222"   # monitoring (healthz)
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8222/healthz > /dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BIN: dropit-api
    image: dropit-api:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      DROPIT_BIND: 0.0.0.0:8080
      RUST_LOG: info,dropit=debug
      DATABASE_URL: postgres://dropit:dropit_local@postgres:5432/dropit
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      # Миграции запускает воркер (ниже) — API их не выполняет.
      DROPIT_RUN_MIGRATIONS: "false"
      # Stripe: пусто → MockStripe (реальные деньги НЕ проводятся).
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      # Push: пусто → NoopPush (уведомления никуда не уходят).
      FCM_PROJECT_ID: ""
      FCM_SERVICE_ACCOUNT_JSON: ""
      APNS_TEAM_ID: ""
      APNS_KEY_ID: ""
      APNS_PRIVATE_KEY_P8: ""
      APNS_TOPIC: ""
      APNS_SANDBOX: ""
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  workers:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BIN: dropit-workers
    image: dropit-workers:local
    command: ["run"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    environment:
      RUST_LOG: info,dropit=debug
      DATABASE_URL: postgres://dropit:dropit_local@postgres:5432/dropit
      REDIS_URL: redis://redis:6379
      NATS_URL: nats://nats:4222
      # Локальный стенд: воркер применяет миграции при старте.
      # В prod миграции — отдельным шагом, эта переменная = false.
      DROPIT_RUN_MIGRATIONS: "true"
      STRIPE_API_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      FCM_PROJECT_ID: ""
      FCM_SERVICE_ACCOUNT_JSON: ""
      APNS_TEAM_ID: ""
      APNS_KEY_ID: ""
      APNS_PRIVATE_KEY_P8: ""
      APNS_TOPIC: ""
      APNS_SANDBOX: ""
    restart: unless-stopped

volumes:
  pgdata:
  natsdata:
