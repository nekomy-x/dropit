# DROP IT — PROD nginx site (Test Mode stand), single origin on :80.
#
# Installed by deploy/prod/host/apply-config.sh as
#   /etc/nginx/sites-available/dropit.conf -> /etc/nginx/sites-enabled/dropit.conf
# and takes over `default_server` from the distro `default` site (which the
# installer disables).
#
# Layout it serves (see deploy/servers/prod.md):
#   /         -> /srv/dropit/web/club    (React SPA, Vite base '/')
#   /admin/   -> /srv/dropit/web/admin   (React SPA, Vite base '/admin/')
#   /dj-mock/ -> /srv/dropit/web/dj-mock (static design prototype, NOT the product)
#   /v1/, /healthz, /readyz -> 127.0.0.1:8080 (dropit-api)
#
# /dj is NOT a separate location on purpose: apps/web-club is a single SPA whose
# own routes include /dj (live DJ console, role-gated), /dj/login and
# /dj/invite/:token. Those must reach the SPA shell so the client router can
# resolve them — a location /dj/ block would shadow the real DJ panel with the
# static prototype.
#
# TLS is not configured yet: the stand is reachable over plain HTTP on :80.
# Certbot/443 is a separate step (see deploy/servers/prod.md, "Known gaps").

# --- WebSocket upgrade plumbing -------------------------------------------
# Only send `Connection: upgrade` when the client actually asked for it,
# otherwise keepalive requests get a bogus Connection header.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream dropit_api {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Optional per-host HTTPS listener/certificate installed by enable-ip-tls.sh.
    include /srv/dropit/etc/nginx-listeners*.conf;
    server_name _;

    # Club SPA is the root site; /admin/ and /dj-mock/ are carved out below.
    root /srv/dropit/web/club;
    index index.html;

    charset utf-8;
    client_max_body_size 2m;

    access_log /var/log/nginx/dropit.access.log;
    error_log  /var/log/nginx/dropit.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # --- API --------------------------------------------------------------
    # Everything the axum gateway owns lives under /v1/.
    location /v1/ {
        proxy_pass http://dropit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # WebSocket hub: one-shot ticket + long-lived socket.
    # Long read timeout so idle live connections are not reaped, and no
    # buffering so frames pass straight through.
    location /v1/ws {
        proxy_pass http://dropit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_buffering off;
    }

    # Health probes for the API (systemd/ops/monitoring).
    location = /healthz {
        proxy_pass http://dropit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://dropit_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout    10s;
        access_log off;
    }

    # --- club SPA hashed assets ------------------------------------------
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/dropit-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    # Downloads are files, never SPA routes. HEAD must report a real APK or 404.
    location ^~ /downloads/ {
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Domain association must be real JSON or 404, never the SPA HTML shell.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    # Vite emits content-hashed filenames, so they can be cached forever.
    # Публичная статус-страница сервисов (статика, без авторизации).
    location = /status {
        return 301 /status/;
    }

    location /status/ {
        root /srv/dropit/web;
        index index.html;
        try_files $uri $uri/ /status/index.html;
    }

    location ^~ /assets/ {
        root /srv/dropit/web/club;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # --- admin SPA hashed assets -----------------------------------------
    location ^~ /admin/assets/ {
        root /srv/dropit/web;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # --- admin SPA --------------------------------------------------------
    # Vite base '/admin/': shell is /admin/index.html, deep links fall back
    # to it so the client-side router can resolve them.
    location /admin/ {
        root /srv/dropit/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /admin/index.html;
    }

    # --- static DJ console prototype --------------------------------------
    # A design prototype, not the product surface. The live DJ console is a
    # route inside the club SPA at /dj (role-gated, talks to the real API).
    # Kept reachable for design review under /dj-mock/.
    location /dj-mock/ {
        root /srv/dropit/web;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /dj-mock/index.html;
    }

    # --- club SPA ---------------------------------------------------------
    # Catches /, /connect, /login, /register, and the DJ routes /dj,
    # /dj/login, /dj/invite/:token. Shell must not be cached (deploys ship a
    # new asset manifest).
    location / {
        root /srv/dropit/web/club;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
