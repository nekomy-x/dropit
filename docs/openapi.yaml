        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/payments:
    get:
      tags: [admin-panel]
      summary: Платежи (админ)
      description: |
        Последние платежи (`ORDER BY created_at DESC`, `LIMIT` 1..500,
        дефолт 100). Необязательные фильтры:
          * `status` — значение из стейт-машины платежа
            (`intent` | `processing` | `captured` |
            `partially_refunded` | `refunded` | `failed` |
            `cancelling` | `cancelled`); мусор → `400 invalid_status`.
          * `club_id` — изоляция клуба через `payment → request →
            session → club` (у payment нет колонки club_id, фильтр — JOIN).
        Без параметров — прежнее поведение (последние платежи без фильтра).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [intent, processing, captured, partially_refunded, refunded, failed, cancelling, cancelled]
        - name: club_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Список платежей }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
