        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/djs:
    get:
      tags: [club-panel]
      summary: Состав DJ клуба
      description: |
        Строки `dj` этого клуба. По умолчанию — только действующий состав
        (`removed_at IS NULL`); `?include_removed=1` добавляет снятых с
        состава, чтобы их можно было вернуть.

        `online` — heartbeat моложе `presence_ttl_seconds` (DJ-консоль
        зовёт `POST /v1/dj/presence` раз в 30 с); `on_shift` — у DJ есть
        незакрытая сессия; `note` — рабочая заметка клуба.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: include_removed
          required: false
          schema: { type: string, enum: ["0", "1", "true", "false"] }
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [server_time, presence_ttl_seconds, items]
                properties:
                  server_time: { type: string, format: date-time }
                  presence_ttl_seconds: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, display_name, email, status, online, on_shift, removed]
                      properties:
                        id: { type: string, format: uuid }
                        display_name: { type: string }
                        email: { type: string, format: email }
                        status: { type: string, enum: [invited, active, suspended, blocked] }
                        note: { type: string, nullable: true, maxLength: 500 }
                        last_seen_at: { type: string, format: date-time, nullable: true }
                        presence_age_seconds: { type: integer, nullable: true }
                        online: { type: boolean }
                        on_shift: { type: boolean }
                        open_session_id: { type: string, format: uuid, nullable: true }
                        removed: { type: boolean }
                        removed_at: { type: string, format: date-time, nullable: true }
                        invite_expires_at: { type: string, format: date-time, nullable: true }
                        has_password: { type: boolean }
                        created_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/dj-console/session:
    post:
      tags: [club-panel]
      summary: Открыть консоль диджея от имени диджея смены
      description: |
        Выдаёт DJ-пару токенов для диджея на открытой смене этого клуба,
        чтобы клуб работал в консоли без второго логина.

        Это делегирование доступа, а не второй аккаунт: refresh-токен
        живёт 12 часов (одна смена, не 30 дней), принадлежит только
        диджею этого клуба на его открытой смене, и каждый вход пишется
        в `audit_log` как `club_dj_console_open` — «кто-то работал в
        консоли от имени диджея» должно быть восстановимо по журналу.

        Отказ — `409` с отдельным кодом на каждую причину, потому что у
        панели для каждой своё действие:

        * `no_open_shift` — открытой смены нет;
        * `dj_required` — смена без диджея, а в составе их несколько:
          `details.candidates` перечисляет активных, выбранный идёт в
          `dj_id` следующего запроса;
        * `dj_unavailable` — диджей назначен, но недоступен (приостановлен,
          заблокирован, снят), либо запрошенный `dj_id` не из этого клуба;
        * `no_djs` — в составе клуба нет активных диджеев;
        * `shift_changed` — смену закрыли или диджея назначили, пока
          открывалась консоль.

        Если на открытой смене нет диджея, а активный в составе один, сервер
        назначает его сам и открывает консоль — «одна кнопка» не должна
        упираться в форму из-за единственного кандидата.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dj_id:
                  type: string
                  format: uuid
                  description: |
                    Кого поставить за пульт, если на открытой смене ещё нет
                    диджея. Необязателен: при одном активном диджее клуб не
                    выбирает его явно, а при уже назначенном на смену диджее
                    это поле не может его подменить.
      responses:
        "200":
          description: Пара токенов диджея смены
          content:
            application/json:
              schema:
                type: object
                required: [access_token, refresh_token, token_type, expires_in, dj, session]
                properties:
                  access_token: { type: string }
                  refresh_token: { type: string }
                  token_type: { type: string, enum: [Bearer] }
                  expires_in: { type: integer, description: TTL access-токена, секунды }
                  dj:
                    type: object
                    required: [id, display_name]
                    properties:
                      id: { type: string, format: uuid }
                      display_name: { type: string }
                  session:
                    type: object
                    required: [id, status, timezone]
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string, enum: [created, active, paused_acceptance] }
                      timezone: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/dj/invite/accept:
    post:
      tags: [dj]
      summary: Активировать приглашение DJ
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_token, password]
              properties:
                invite_token: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200": { description: Аккаунт активирован }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/dj/invite/{token}:
    get:
      tags: [dj]
      summary: Публичные данные приглашения DJ
      description: |
        Страница `/dj/invite/:token` показывает имя DJ и клуб до задания
        пароля — иначе письмо выглядит фишингом. Отдаются ровно три поля:
        `display_name`, `club_name`, `expires_at`. Неизвестный, просроченный,
        уже принятый и битый токен дают один `404 invite_not_found`.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Имя DJ, клуб и срок ссылки
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DjInvitePreview" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/djs/{id}:
    patch:
      tags: [club-panel]
      summary: Изменить доступ и/или заметку DJ клуба
      description: |
        Поля независимы и оба необязательны, но хотя бы одно должно быть
        передано:

        * `status` — `active` | `suspended`; допускается только для DJ,
          принявшего приглашение (иначе `409 dj_status_locked`);
        * `note` — строка до 500 символов (`null` очищает заметку).

        Клуб берётся из токена, `club_id` в теле отсутствует. Снятый с
        состава DJ (`removed_at IS NOT NULL`) отвечает `404 dj_not_found` —
        его сначала возвращают через `/restore`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended] }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        "200":
          description: Доступ и/или заметка изменены
          content:
            application/json:
              schema:
                type: object
                required: [id, display_name, status]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  status: { type: string }
                  note: { type: string, nullable: true }
        "400":
          description: |
            Пустое тело (ни `status`, ни `note`), неизвестный `status` или
            заметка длиннее 500 символов.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [club-panel]
      summary: Снять DJ с состава
      description: |
        Мягкое удаление: строка `dj` сохраняется (`removed_at`), потому что
        на неё ссылаются история смен и выплат; доступ блокируется, инвайт
        аннулируется, DJ скрывается из состава и может быть возвращён через
        `POST /v1/club/djs/{id}/restore`.

        Два исключения:

        * DJ, так и не принявший приглашение (нет пароля, нет смен),
          удаляется физически — иначе `UNIQUE(email)` навсегда заблокировал
          бы повторный инвайт на тот же адрес (`deleted: "hard"`);
        * DJ с открытой сменой снять нельзя — `409 dj_on_shift`, сначала
          закрывается смена.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: DJ снят с состава
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted, status]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  deleted: { type: string, enum: [soft, hard] }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/club/djs/{id}/restore:
    post:
      tags: [club-panel]
      summary: Вернуть DJ в состав
      description: |
        Снимает `removed_at` и восстанавливает доступ (`status = active`).
        Идемпотентно: на DJ, который и так в составе, отвечает 200 с текущим
        состоянием.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: DJ в составе
          content:
            application/json:
              schema:
                type: object
                required: [id, display_name, status, removed]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  status: { type: string }
                  removed: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/dj/presence:
    post:
      tags: [dj]
      summary: Heartbeat присутствия DJ
      description: |
        DJ-консоль зовёт раз в 30 с, пока вкладка видима; клуб читает
        `last_seen_at` в `GET /v1/club/djs` и считает DJ «в сети», пока
        heartbeat моложе 90 с. Ничего не кешируется и не пишется в
        реальном времени: это одна строка `dj.last_seen_at`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Присутствие отмечено
          content:
            application/json:
              schema:
                type: object
                required: [last_seen_at, online]
                properties:
                  last_seen_at: { type: string, format: date-time }
                  online: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/djs/invite:
    post:
      tags: [club-panel]
      summary: Приглашение DJ в клуб
      description: |
        DJ создаётся в статусе invited (без пароля — логин невозможен до
        завершения инвайт-флоу). Одноразовый invite_token (128 бит, hex),
        TTL 7 дней. Повторный инвайт того же e-mail в этот клуб →
        409 dj_already_invited.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: DJ приглашён
          content:
            application/json:
              schema:
                type: object
                required: [dj_id, invite_token, invite_expires_at]
                properties:
                  dj_id: { type: string, format: uuid }
                  invite_token: { type: string }
                  invite_expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  # ---------- Онбординг клуба: заявка → approve → активация ----------
  /v1/club/onboarding/apply:
    post:
      tags: [onboarding]
      summary: Публичная заявка на подключение клуба
      description: |
        Без авторизации: заявку оставляет посетитель лендинга `/connect`.
        Секретов не принимает (ни `password`, ни токенов): пароль владелец
        задаёт позже, на странице активации. Первое нарушение валидации →
        `422 validation_error` с `details.field` (`club.name`, `venue.capacity`,
        `qr.price_minor`, …).

        Ограничители: 5 заявок/час с IP (`429 rate_limited`), не больше 3
        pending на один contact, идемпотентность по `Idempotency-Key`
        (повтор → `200` и та же заявка).
      security: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingApplyRequest" }
      responses:
        "201":
          description: Заявка создана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApplyResponse" }
        "200":
          description: Идемпотентный повтор — та же заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApplyResponse" }
        "422": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/onboarding/invite/{token}:
    get:
      tags: [onboarding]
      summary: Данные ссылки активации клуба
      description: |
        Публично: единственный секрет — сам токен (64 hex). Неизвестный,
        использованный, просроченный и битый токен неразличимы снаружи —
        один `404 invite_not_found`. В `contact` — контакт из заявки
        (телефон или e-mail).
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "200":
          description: Данные заявки для страницы активации
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubInvitePreview" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/onboarding/invite/{token}/accept:
    post:
      tags: [onboarding]
      summary: Активация клуба — задать пароль
      description: |
        Публично. Пароль 8..128 символов хешируется Argon2id, `club.status`
        становится `active`, `invite_token_hash`/`invite_expires_at`
        зануляются (одноразовость), в `audit_log` пишется
        `club.invite.accept`. Ответ — `TokenPair` (авто-логин) + `club`.

        Слабый/отсутствующий пароль → `422 validation_failed` с
        `details.field=password`; повторное использование ссылки → `404`.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: "^[0-9a-f]{64}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8, maxLength: 128 }
      responses:
        "200":
          description: Клуб активирован, пара токенов выдана
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClubInviteAcceptResponse" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/onboarding-applications:
    get:
      tags: [onboarding]
      summary: Очередь заявок на подключение клуба
      description: |
        Роль Admin (readonly читает). Keyset-пагинация `(created_at DESC,
        id DESC)` без OFFSET; `next_cursor` — непрозрачный base64url, мусор
        в курсоре → `422`. По умолчанию `status=pending_moderation`.

        Каждая строка несёт `club_id` (`null`, пока заявка не одобрена) и
        `invite_state`: `none | pending | accepted | expired`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending_moderation, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Страница заявок
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApplicationPage" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/onboarding-applications/{id}:
    get:
      tags: [onboarding]
      summary: Карточка заявки
      description: |
        Полный payload заявки (`club`/`venue`/`qr`), решение и `invite_state`.
        Неизвестный и битый id — один `404 not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Заявка
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApplicationDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/onboarding-applications/{id}/approve:
    post:
      tags: [onboarding]
      summary: Одобрить заявку и создать клуб
      description: |
        Одна транзакция: клуб создаётся в `pending_verification` с
        `password_hash='!'` (вход по паролю невозможен до активации),
        одноразовой invite-ссылкой (64 hex, sha256 в БД, TTL 7 дней) и
        `qr_master_token` (админский вход). Заявка → `approved`,
        `reviewed_by/at`, audit.

        * `email` необязателен: по умолчанию `club_application.email`,
          иначе `422 details.field=email`;
        * `slug` необязателен: иначе генерируется из названия;
        * `password` — **deprecated**: если передан, сохраняется прежнее
          поведение (Argon2id-хеш и рабочий вход); invite-ссылка выпускается
          в любом случае;
        * `mail_queued` — правда «строка письма `club_invite` в очереди»;
          ошибка почты не отменяет approve.

        Конфликты: `409 already_reviewed`, `409 email_taken`,
        `409 slug_taken`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingApproveRequest" }
      responses:
        "200":
          description: Клуб создан, ссылка выпущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingApproveResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/onboarding-applications/{id}/reject:
    post:
      tags: [onboarding]
      summary: Отклонить заявку с причиной
      description: |
        Причина 1..500 символов сохраняется в `reject_reason` и в audit.
        Повторный review (approve/reject) → `409 already_reviewed`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Заявка отклонена
          content:
            application/json:
              schema:
                type: object
                required: [application_id, status]
                properties:
                  application_id: { type: string, format: uuid }
                  status: { type: string, enum: [rejected] }
                  reviewed_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/onboarding-applications/{id}/invite:
    post:
      tags: [onboarding]
      summary: Перевыпустить ссылку активации клуба
      description: |
        Для `approved`-заявки с ещё не активированным клубом: выпускается
        НОВЫЙ токен (старый перестаёт работать сразу), новый TTL 7 дней,
        письмо `club_invite` ставится в очередь. Аудит
        `club_application.invite`.

        * `409 not_approved` — заявка ещё не одобрена;
        * `409 invite_already_accepted` — клуб уже задал пароль;
        * `404 not_found` — неизвестная заявка.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Ссылка перевыпущена
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OnboardingReissueResponse" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/payouts:
    get:
      tags: [club-panel]
      summary: Выплаты клуба
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: История выплат }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/stripe/onboarding-status:
    get:
      tags: [club-panel]
      summary: Статус Stripe-онбординга клуба
      description: |
        Живая синхронизация с провайдером (retrieve_account); при ошибке
        провайдера — деградация: возвращается последнее сохранённое
        состояние (в лог warn, не 500).
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Статус онбординга
          content:
            application/json:
              schema:
                type: object
                required: [stripe_account_id, status, charges_enabled, payouts_enabled, details_submitted]
                properties:
                  stripe_account_id:
                    anyOf: [{ type: string }, { type: "null" }]
                  status: { type: string, enum: [none, pending, restricted, enabled] }
                  charges_enabled: { type: boolean }
                  payouts_enabled: { type: boolean }
                  details_submitted: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/stripe/onboarding-link:
    post:
      tags: [club-panel]
      summary: Создание/обновление Stripe onboarding-link
      description: |
        Если у клуба нет stripe_account_id — создаётся Connect-аккаунт
        (идемпотентно по сохранённому id). Затем запрашивается
        account_link — URL Stripe-hosted формы. Ошибка провайдера →
        502 stripe_unavailable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_url, return_url]
              properties:
                refresh_url: { type: string }
                return_url: { type: string }
      responses:
        "201":
          description: URL формы онбординга
          content:
            application/json:
              schema:
                type: object
                required: [url, expires_at]
                properties:
                  url: { type: string }
                  expires_at:
                    anyOf: [{ type: string, format: date-time }, { type: "null" }]
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/dashboard/now:
    get:
      tags: [admin-panel]
      summary: "Дашборд админа: сессии, req/min, оборот"
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Метрики сейчас }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/clubs:
    get:
      tags: [admin-panel]
      summary: Список клубов (+обороты)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Список }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin-panel]
      summary: Создание клуба (админ)
      description: |
        Клуб создаётся в статусе pending_verification (верификация —
        отдельный шаг админа). qr_master_token — постоянный токен входа
        клуба (128 бит, hex), отдаётся один раз. Невалидный IANA-timezone
        → 400 invalid_timezone.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, city, timezone]
              properties:
                name: { type: string, minLength: 2, maxLength: 80 }
                city: { type: string, minLength: 2, maxLength: 60 }
                timezone: { type: string, description: IANA-зона }
                address: { type: string }
      responses:
        "201":
          description: Клуб создан
          content:
            application/json:
              schema:
                type: object
                required: [club_id, name, qr_master_token]
                properties:
                  club_id: { type: string, format: uuid }
                  name: { type: string }
                  qr_master_token: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/clubs/{id}:
    get:
      tags: [admin-panel]
      summary: Карточка клуба
      description: |
        Те же поля, что в списке клубов, плюс Stripe-статус онбординга и
        сохранённый оборот. Неизвестный id → 404 `club_not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Клуб
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  city: { type: string, nullable: true }
                  slug: { type: string }
                  address: { type: string, nullable: true }
                  country: { type: string, nullable: true }
                  email: { type: string }
                  phone: { type: string, nullable: true }
                  logo_url: { type: string, nullable: true }
                  stripe_account_id: { type: string, nullable: true }
                  stripe_onboarding_status: { type: string, nullable: true }
                  status: { type: string }
                  created_at: { type: string, format: date-time }
                  turnover_minor: { type: integer, description: Сумма в minor units }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin-panel]
      summary: Правка/блокировка/верификация клуба
      description: |
        Профильные поля и статус. Статус-онли правка пишется в audit_log как
        `club.status_change`, остальные — `club.update` с diff before/after.
        Занятый slug → 409 `slug_taken`, занятый e-mail → 409 `email_taken`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                slug: { type: string, pattern: "^[a-z0-9-]{3,60}$" }
                email: { type: string, format: email }
                city: { type: string, maxLength: 120, nullable: true }
                address: { type: string, maxLength: 200, nullable: true }
                phone: { type: string, maxLength: 40, nullable: true }
                country: { type: string, minLength: 2, maxLength: 2, nullable: true }
                status: { type: string, enum: [active, suspended, blocked, pending_verification] }
      responses:
        "200": { description: Клуб обновлён (объект клуба) }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin-panel]
      summary: Мягкое удаление клуба
      description: |
        Soft-delete: `club.status = 'blocked'`, все refresh-токены клуба
        отзываются, событие пишется в audit_log. Клуб с открытой сессией
        удалить нельзя → 409 `club_has_active_session` (сначала закройте смену).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Клуб заблокирован }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/users:
    get:
      tags: [admin-panel]
      summary: Каталог пользователей платформы
      description: |
        Объединённая директория principal-ролей: администраторы
        (`admin_user`), сотрудники клубов (`club`), DJ (`dj`) и гости с
        аккаунтом (`guest_account`). Анонимные устройства в каталог не
        попадают — ими управляет `GET /v1/admin/guests?club_id=`.

        Keyset-пагинация по `(created_at, id)`: `next_cursor` из ответа
        передаётся в `cursor`. `q` ищет по e-mail и отображаемому имени
        (ILIKE, `%`/`_`/`\` экранируются). Мусорный `role`/`status`/`limit`/
        `cursor` → 400 в конверте ошибки.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: role, in: query, schema: { type: string, enum: [admin, club_staff, dj, guest] } }
        - { name: status, in: query, schema: { type: string, enum: [active, invited, suspended, blocked] } }
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Страница каталога
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, role, status]
                      properties:
                        id: { type: string, format: uuid }
                        role: { type: string, enum: [admin, club_staff, dj, guest] }
                        status: { type: string, enum: [active, invited, suspended, blocked] }
                        display_name: { type: string, nullable: true }
                        email: { type: string, nullable: true }
                        club_id: { type: string, format: uuid, nullable: true }
                        created_at: { type: string, format: date-time }
                        last_seen_at: { type: string, format: date-time, nullable: true }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin-panel]
      summary: Создание администратора
      description: |
        Создаёт только администратора. Пароль хешируется Argon2id, TOTP-секрет
        шифруется (`DROPIT_TOTP_KEY`, без ключа — legacy-plain Test Mode).
        `totp_secret` и `otpauth_url` отдаются ОДИН раз (`Cache-Control:
        no-store`) — без них админ не сможет войти (TOTP обязателен).

        Для `role` ≠ admin → 422 `role_not_creatable` с подсказкой, каким
        существующим маршрутом создаётся сущность.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role, email, display_name, password]
              properties:
                role: { type: string, enum: [admin] }
                email: { type: string, format: email }
                display_name: { type: string, minLength: 1, maxLength: 120 }
                password: { type: string, minLength: 8, maxLength: 128 }
                admin_role: { type: string, enum: [superadmin, operator, readonly], default: operator }
      responses:
        "201":
          description: Админ создан (секрет enrollment — только здесь)
          content:
            application/json:
              schema:
                type: object
                required: [id, role, admin_role, status, email, totp_secret, otpauth_url]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [admin] }
                  admin_role: { type: string, enum: [superadmin, operator, readonly] }
                  status: { type: string, enum: [active] }
                  display_name: { type: string }
                  email: { type: string }
                  totp_secret: { type: string, description: Base32-секрет, показывается один раз }
                  otpauth_url: { type: string, description: "otpauth://totp/…" }
                  created_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/users/bulk:
    post:
      tags: [admin-panel]
      summary: Массовое действие над пользователями
      description: |
        Одна транзакция и одна запись `audit_log` (`admin.user.bulk`).
        `affected` — сколько записей реально нашли; заблокировать себя нельзя
        (422). Понижение последнего активного superadmin → 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, action]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
                action: { type: string, enum: [approve, suspend, block, role] }
                role: { type: string, enum: [superadmin, operator, readonly] }
      responses:
        "200":
          description: Результат массовой операции
          content:
            application/json:
              schema:
                type: object
                required: [affected, ids]
                properties:
                  affected: { type: integer }
                  ids:
                    type: array
                    items: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/users/{id}:
    get:
      tags: [admin-panel]
      summary: Одна запись каталога пользователей
      description: Неизвестный id → 404 `not_found`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Запись каталога
          content:
            application/json:
              schema:
                type: object
                required: [id, role, status]
                properties:
                  id: { type: string, format: uuid }
                  role: { type: string, enum: [admin, club_staff, dj, guest] }
                  status: { type: string, enum: [active, invited, suspended, blocked] }
                  display_name: { type: string, nullable: true }
                  email: { type: string, nullable: true }
                  club_id: { type: string, format: uuid, nullable: true }
                  created_at: { type: string, format: date-time }
                  last_seen_at: { type: string, format: date-time, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin-panel]
      summary: Правка пользователя (роль/статус/имя/e-mail)
      description: |
        Роль-код (`superadmin|operator|readonly`) меняется только у админа;
        у клубов/DJ/гостей роль неизменяема → 422 `role_immutable`. Свою роль
        и свой статус менять нельзя (422 `cannot_change_own_role`). Понижение
        или блокировка последнего активного superadmin → 409 `last_superadmin`.
        `suspended|blocked` отзывают refresh-токены в той же транзакции.
        Каждая мутация пишет `audit_log` с before/after.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name: { type: string, minLength: 1, maxLength: 120 }
                email: { type: string, format: email }
                role: { type: string, enum: [superadmin, operator, readonly] }
                status: { type: string, enum: [active, suspended, blocked] }
      responses:
        "200": { description: Обновлённая запись каталога }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin-panel]
      summary: Мягкое удаление пользователя
      description: |
        Soft-block: статус `blocked`, refresh-токены отозваны (гостю —
        бан устройств). Себя удалить нельзя (422), последнего superadmin —
        нельзя (409 `last_superadmin`). Запись в `audit_log`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: Пользователь заблокирован }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/roles:
    get:
      tags: [admin-panel]
      summary: Матрица ролей и прав
      description: |
        Read-only. Возможности выведены из фактического кода: `enforced_by`
        называет модуль/route-family, `planned` — ограничение заявлено, но
        пока не применено на всех роутах (например operator vs superadmin).
        `current_admin_role` — подроль запрашивающего админа из
        `admin_user.role`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Матрица прав
          content:
            application/json:
              schema:
                type: object
                required: [current_admin_role, roles, admin_roles]
                properties:
                  current_admin_role: { type: string, enum: [superadmin, operator, readonly] }
                  roles:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, enum: [guest, dj, club, admin] }
                        label: { type: string }
                        capabilities:
                          type: array
                          items:
                            type: object
                            properties:
                              code: { type: string }
                              allowed: { type: boolean }
                              enforced_by: { type: string }
                  admin_roles:
                    type: array
                    items:
                      type: object
                      properties:
                        code: { type: string, enum: [superadmin, operator, readonly] }
                        can_write: { type: boolean }
                        can_manage_users: { type: boolean }
                        description: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/djs/{id}:
    patch:
      tags: [admin-panel]
      summary: Правка DJ (статус, клуб, имя)
      description: |
        Смена клуба проверяет его существование (404 `club_not_found`).
        При `suspended|blocked` refresh-токены DJ отзываются. Пишется
        `audit_log` (`dj.update`) с before/after.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, invited, suspended, blocked] }
                club_id: { type: string, format: uuid }
                display_name: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Обновлённый DJ
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  email: { type: string }
                  club_id: { type: string, format: uuid, nullable: true }
                  status: { type: string }
                  stripe_account_id: { type: string, nullable: true }
                  stripe_onboarding_status: { type: string, nullable: true }
                  removed: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [admin-panel]
      summary: Удаление DJ (hard/soft)
      description: |
        Hard-delete — только для непринятого приглашения без смен
        (`password_hash='!'` и нет сессий); иначе soft (`removed_at`,
        статус → suspended) и отзыв refresh-токенов. Пишется `audit_log`
        (`dj.remove`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Результат удаления
          content:
            application/json:
              schema:
                type: object
                required: [id, removed]
                properties:
                  id: { type: string, format: uuid }
                  removed: { type: string, enum: [hard, soft] }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/djs/{id}/restore:
    post:
      tags: [admin-panel]
      summary: Восстановление DJ
      description: Снимает `removed_at`, возвращает статус `active`, пишет `audit_log` (`dj.restore`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: DJ восстановлен
          content:
            application/json:
              schema:
                type: object
                required: [id, status, removed]
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string }
                  removed: { type: boolean, enum: [false] }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/guests/{id}:
    patch:
      tags: [admin-panel]
      summary: Бан/разбан гостевого устройства
      description: |
        `banned` пишется в `guest_device`; повторное значение идемпотентно
        (аудит только при фактической смене, `guest.ban`/`guest.unban`).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [banned]
              properties:
                banned: { type: boolean }
      responses:
        "200":
          description: Текущее состояние бана
          content:
            application/json:
              schema:
                type: object
                required: [id, banned]
                properties:
                  id: { type: string, format: uuid }
                  banned: { type: boolean }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/dj/history:
    get:
      tags: [dj]
      summary: История сыгранных заявок текущей смены
      description: |
        Только роль DJ. Keyset-пагинация по `(played_at, id)` (курсор —
        непрозрачный base64url). Нет открытой смены → 200 с пустым списком.
        `accepted_at` берётся из события `request.accepted`; если его нет —
        `null` (не выдумывается).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        artist: { type: string }
                        style: { type: string, nullable: true }
                        played_at: { type: string, format: date-time }
                        accepted_at: { type: string, format: date-time, nullable: true }
                        same_track_count: { type: integer }
                        cover_url: { type: string, nullable: true }
                  next_cursor: { type: string, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/dj/stats/session:
    get:
      tags: [dj]
      summary: Показатели текущей смены DJ
      description: |
        В отличие от `/v1/dj/stats/today` (всё время), считает ТОЛЬКО открытую
        смену: запросы, принятые, сыгранные и заработанные доли DJ в minor
        units. Смены нет → `session: null` и нули.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Счётчики смены
          content:
            application/json:
              schema:
                type: object
                required: [session, requests, accepted, played_session, rejected, earned_session_minor]
                properties:
                  session:
                    anyOf:
                      - type: object
                        properties:
                          id: { type: string, format: uuid }
                          status: { type: string }
                          timezone: { type: string }
                      - type: "null"
                  requests: { type: integer }
                  accepted: { type: integer }
                  played_session: { type: integer }
                  rejected: { type: integer }
                  earned_session_minor: { type: integer, description: Minor units }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/overview:
    get:
      tags: [admin-panel]
      summary: Обзор платформы (реальные агрегаты)
      description: |
        Все числа — из SQL по текущему состоянию БД; серии считаются по
        `date_trunc` за период. Пропущенные бакеты заполняются нулями, поэтому
        длина серии всегда равна числу точек периода: 24 (по часам), 7 или
        30 (по дням). Деньги — целые minor units.

        Серия `revenue_minor` — `amount_minor - refunded_minor` по
        `payment.captured_at` для статусов `captured`, `partially_refunded`,
        `refunded`. Мусорный `period` → 400 `validation_error`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          schema: { type: string, enum: [24h, 7d, 30d], default: 24h }
      responses:
        "200":
          description: Обзор
          content:
            application/json:
              schema:
                type: object
                required: [period, generated_at, clubs, djs, sessions, requests, payments, guests, series]
                properties:
                  period: { type: string, enum: [24h, 7d, 30d] }
                  generated_at: { type: string, format: date-time }
                  clubs:
                    type: object
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      pending_verification: { type: integer }
                      suspended: { type: integer }
                  djs:
                    type: object
                    properties:
                      total: { type: integer }
                      active: { type: integer }
                      invited: { type: integer }
                      suspended: { type: integer }
                  sessions:
                    type: object
                    properties:
                      open: { type: integer }
                      created: { type: integer }
                      paused_acceptance: { type: integer }
                  requests:
                    type: object
                    properties:
                      total: { type: integer }
                      pending: { type: integer }
                      accepted: { type: integer }
                      played: { type: integer }
                      rejected: { type: integer }
                  payments:
                    type: object
                    properties:
                      captured_count: { type: integer }
                      captured_minor: { type: integer, description: Minor units }
                      refunded_minor: { type: integer, description: Minor units }
                      failed_count: { type: integer }
                  guests:
                    type: object
                    properties:
                      total: { type: integer }
                      online_24h: { type: integer }
                  series:
                    type: object
                    required: [requests, revenue_minor]
                    properties:
                      requests:
                        type: array
                        description: Ровно 24/7/30 точек в зависимости от period
                        items:
                          type: object
                          required: [bucket, value]
                          properties:
                            bucket: { type: string, format: date-time }
                            value: { type: integer }
                      revenue_minor:
                        type: array
                        items:
                          type: object
                          required: [bucket, value]
                          properties:
                            bucket: { type: string, format: date-time }
                            value: { type: integer, description: Minor units }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/feature-flags:
    get:
      tags: [admin-panel]
      summary: Фича-флаги платформы
      description: |
        Набор флагов — контракт (миграция 0020), а не произвольный key-value
        store: `payments_live`, `guest_signup_open`, `dj_self_signup`,
        `maintenance_banner`. Отсортировано по `key`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Список флагов
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [key, enabled, description, updated_at]
                      properties:
                        key: { type: string }
                        enabled: { type: boolean }
                        description: { type: string }
                        updated_at: { type: string, format: date-time }
                        updated_by: { type: string, format: uuid, nullable: true }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/feature-flags/{key}:
    patch:
      tags: [admin-panel]
      summary: Переключение фича-флага
      description: |
        Только существующий ключ; неизвестный → 404 `not_found`. Аудит
        (`feature_flag.update`) пишется в той же транзакции, что и `UPDATE`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Флаг обновлён
          content:
            application/json:
              schema:
                type: object
                required: [key, enabled, description, updated_at]
                properties:
                  key: { type: string }
                  enabled: { type: boolean }
                  description: { type: string }
                  updated_at: { type: string, format: date-time }
                  updated_by: { type: string, format: uuid, nullable: true }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/export:
    get:
      tags: [admin-panel]
      summary: Выгрузка данных (CSV/JSON)
      description: |
        Потоковая выгрузка из БД, а не браузерный Blob: CSV экранируется по
        RFC 4180 (кавычки удваиваются, поля с `,`, `"`, переводом строки
        берутся в кавычки) и отдаётся с `Content-Disposition: attachment`.
        Выше 5000 строк — 400 `export_too_large` (обрезать молча нельзя).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: query
          required: true
          schema: { type: string, enum: [users, clubs, djs, payments] }
        - name: format
          in: query
          schema: { type: string, enum: [csv, json], default: csv }
      responses:
        "200":
          description: |
            CSV (`text/csv; charset=utf-8`) либо JSON
            `{resource, generated_at, items}`.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                required: [resource, generated_at, items]
                properties:
                  resource: { type: string }
                  generated_at: { type: string, format: date-time }
                  items:
                    type: array
                    items: { type: object }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/payments/{id}/refund:
    post:
      tags: [admin-panel, payments]
      summary: Возврат платежа (полный или частичный)
      description: |
        Возврат идёт у провайдера, затем ОДНОЙ транзакцией БД фиксируются
        `payment.refunded_minor`, пропорциональный реверс сплитов
        (Σ прироста `reversed_minor` == сумма возврата), ledger-проводка
        `reversal` (Σ по txn == 0), outbox `payment.refunded` и аудит.

        Без `amount_minor` возвращается весь остаток. Повтор с тем же
        `Idempotency-Key` возвращает тот же ответ и НЕ возвращает деньги
        второй раз. Коды: 409 `invalid_payment_status`, 409
        `already_refunded`, 409 `no_payment_intent`, 409
        `idempotency_conflict` (ключ уже использован на другом платеже), 409
        `refund_conflict` (провайдер вернул деньги, БД отказала — нужна ручная
        сверка), 422 `invalid_refund_amount` (с
        `details.max_refundable_minor`), 500 `split_invariant_violated`
        (инвариант сплитов нарушен — деньги в БД не двигались),
        502 `stripe_unavailable`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount_minor: { type: integer, minimum: 1, description: Minor units; по умолчанию — весь остаток }
                reason: { type: string, enum: [duplicate, fraudulent, requested_by_customer] }
      responses:
        "200":
          description: Возврат применён
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, status, refunded_minor, refund_id, amount_minor, refund_amount_minor, currency]
                properties:
                  payment_id: { type: string, format: uuid }
                  status: { type: string, enum: [partially_refunded, refunded] }
                  refunded_minor: { type: integer, description: Всего возвращено по платежу }
                  refund_id: { type: string, description: "re_… у провайдера" }
                  amount_minor: { type: integer, description: Исходная сумма платежа }
                  refund_amount_minor: { type: integer, description: Сумма ЭТОГО возврата }
                  currency: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/guests:
    get:
      tags: [admin-panel]
      summary: Список гостей клуба (админ)
      description: |
        Только устройства, взаимодействовавшие с клубом (есть грант
        session_guest или запрос в сессии этого клуба). Курсорная
        пагинация keyset по (first_seen DESC, id DESC) — без OFFSET.
        Неизвестный клуб → 404 club_not_found.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: club_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Список гостей
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, created_at, requests_count, last_seen_at, banned]
                      properties:
                        id: { type: string, format: uuid }
                        display_name: { type: string }
                        email: { type: string }
                        created_at: { type: string, format: date-time }
                        requests_count: { type: integer }
                        last_seen_at: { type: string, format: date-time }
                        banned: { type: boolean }
                  next_cursor:
                    anyOf: [{ type: string }, { type: "null" }]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/payments:
    get:
      tags: [admin-panel]
      summary: Платежи (админ)
      description: |
        Последние платежи (`ORDER BY created_at DESC`, `LIMIT` 1..500,
        дефолт 100). Необязательные фильтры:
          * `status` — значение из стейт-машины платежа
            (`intent` | `processing` | `captured` |
            `partially_refunded` | `refunded` | `failed` |
            `cancelling` | `cancelled`); мусор → `400 invalid_status`.
          * `club_id` — изоляция клуба через `payment → request →
            session → club` (у payment нет колонки club_id, фильтр — JOIN).
        Без параметров — прежнее поведение (последние платежи без фильтра).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [intent, processing, captured, partially_refunded, refunded, failed, cancelling, cancelled]
        - name: club_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Список платежей }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/payments/{id}/splits:
    get:
      tags: [admin-panel]
      summary: Сплиты платежа
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Разрез платежа }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/audit-log:
    get:
      tags: [admin-panel]
      summary: Аудит-лог (последние 100)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: append-only журнал }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/platform-settings:
    get:
      tags: [admin-panel]
      summary: Настройки платформы (NULL = не задано владельцем)
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Текущие значения (включая runtime_mode) }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      tags: [admin-panel]
      summary: Изменить настройки (валидация диапазонов, аудит)
      description: |
        Значения задаёт владелец (Q11); код проверяет только
        диапазоны. clear_* флаги сбрасывают поля в NULL.

        `runtime_mode` — режим эксплуатации стенда (test / maintenance /
        normal), который читает публичный `GET /v1/status` для нижнего
        статус-бара панелей. `auto` — режим выводится из фактов стенда
        (открытая регистрация или mock-платежи → test; иначе normal),
        env-флаг `DROPIT_MAINTENANCE` может форсировать maintenance.
        Значение вне enum → `422`.
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                commission_mode: { type: string, enum: [percent, fixed, unset] }
                commission_percent_bp: { type: integer, minimum: 0, maximum: 10000 }
                commission_fixed_minor: { type: integer }
                min_price_minor: { type: integer, minimum: 1 }
                max_price_minor: { type: integer, minimum: 1 }
                dj_share_of_remainder_bp: { type: integer, minimum: 0, maximum: 10000 }
                runtime_mode: { type: string, enum: [auto, test, maintenance, normal] }
                clear_commission_percent_bp: { type: boolean }
                clear_commission_fixed_minor: { type: boolean }
                clear_min_price_minor: { type: boolean }
                clear_max_price_minor: { type: boolean }
