        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/sessions/{id}/echo:
    get:
      tags: [sessions]
      summary: Эхо сессии (DJ)
      description: "Диагностический роут: возвращает session_id и роль из JWT."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Эхо
          content:
            application/json:
              schema:
                type: object
                required: [session_id, role]
                properties:
                  session_id: { type: string, format: uuid }
                  role: { type: string }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F4 — requests / queue / ws-ticket
  # ==========================================================
  /v1/requests:
    post:
      tags: [requests]
      summary: Запрос трека (гость)
      description: |
        Гейты: живой session_guest-грант + session.status == active
        (клиентский session_id на веру НЕ принимается). Пауза → 409
        session_paused. Idempotency-Key обязателен: дубль → replay
        сохранённого ответа (не второй запрос). F4 — без денег
        (price 0); F5 обернёт в payment intent.
      security:
        - deviceToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id:
                  type: string
                  format: uuid
                  description: track_cache.id (серверно-валидированный, F3)
                style:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: Запрос создан (или replay дубля)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, session_id]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending]
                  session_id:
                    type: string
                    format: uuid
                  queue_position:
                    anyOf:
                      - type: integer
                      - type: "null"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/my/requests:
    get:
      tags: [requests]
      summary: Запросы гостя (история + статусы)
      security:
        - deviceToken: []
      responses:
        "200":
          description: Список запросов гостя в активной сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/my/requests/{id}:
    get:
      tags: [requests]
      summary: Карточка заявки гостя
      description: |
        Заявка ищется в активной сессии гостя; чужая или из другой
        сессии → 404 request_not_found (без раскрытия существования).
        position — только для pending, иначе null.
      security:
        - deviceToken: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Деталь заявки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRequestDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/guest/upgrade:
    post:
      tags: [guest]
      summary: Привязка e-mail к гостевому профилю
      description: |
        Идемпотентна: повторный вызов с тем же e-mail → 200 already_upgraded.
        Занятый другим гостем e-mail → 409 email_taken. Невалидный → 400.
      security:
        - deviceToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: E-mail привязан (или уже был)
          content:
            application/json:
              schema:
                type: object
                required: [email, verified, already_upgraded]
                properties:
                  email: { type: string }
                  verified: { type: boolean }
                  already_upgraded: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/guest/verify:
    post:
      tags: [guest]
      summary: Подтверждение e-mail кодом из письма
      description: |
        Код приходит письмом `guest_verify` после `POST /v1/guest/upgrade`
        (ADR-008). Успех выставляет `guest_account.verified = TRUE`; код
        одноразовый и живёт 15 минут.

        Перебор ограничен: пять неверных попыток гасят код, после чего
        нужен новый (повторный апгрейд). Сравнение — по SHA-256 от
        `"{account_id}:{code}"`, сам код в БД не хранится.
      security:
        - deviceToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Шестизначный код из письма
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Адрес подтверждён
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "410":
          description: |
            `code_expired` — код неизвестен, просрочен или погашен
            исчерпанием попыток.
          $ref: "#/components/responses/Error"
        "422":
          description: |
            `invalid_code` — код не совпал; в `details.attempts_left`
            остаток попыток.
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/queue:
    get:
      tags: [requests]
      summary: Очередь запросов DJ
      description: |
        sort=new — по времени; sort=hot — по счётчику той же песни
        (canonical-ключ source:source_id), затем по времени.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, hot]
            default: new
      responses:
        "200":
          description: Активные запросы (pending/accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/accept:
    post:
      tags: [requests]
      summary: DJ принимает запрос
      description: Дубль accept на accepted — no-op (200, noop=true), не 500.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос accepted (или no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/reject:
    post:
      tags: [requests]
      summary: DJ отклоняет запрос
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Запрос rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/played:
    post:
      tags: [requests]
      summary: DJ отметил сыгранным
      description: |
        Разрешён из pending (DJ сыграл, не нажав accept) и из accepted.
        Дубль played — no-op. accept после played → 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/acceptance/pause:
    post:
      tags: [requests]
      summary: Пауза приёма запросов
      description: Блокирует POST /v1/requests (409 session_paused).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: paused_acceptance
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
