        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  # ==========================================================
  # Mail (ADR-008): транзакционные письма через Resend
  # ==========================================================
  /webhooks/resend:
    post:
      tags: [mail]
      summary: Вебхук доставки Resend (Svix-подпись)
      description: |
        Публичный роут без Bearer-токена: доверие даёт только подпись
        Svix (`svix-id`, `svix-timestamp`, `svix-signature`) над СЫРЫМ
        телом. Подпись проверяется по HMAC-SHA256 строки
        `"{svix_id}.{svix_timestamp}.{raw_body}"` секретом
        `RESEND_WEBHOOK_SECRET` (`whsec_…`), допуск по времени — 300 с.

        Идемпотентность: повтор с уже известным `svix-id` отвечает `200`
        с `duplicate: true` и ничего не меняет. Тело разбирается ТОЛЬКО
        после проверки подписи; неизвестный `type` — не ошибка (событие
        пишется в журнал, состояние письма не меняется).

        События → состояние письма: `email.sent` → `sent`,
        `email.delivered` → `delivered`, `email.delivery_delayed` →
        `delivery_delayed`, `email.bounced` → `bounced` (+адрес в
        suppression), `email.complained` → `complained` (+suppression),
        `email.failed` → `failed`, `email.suppressed` → `suppressed`.
        `email.opened`/`email.clicked` пишутся только в журнал.
      security: []
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Тело события Resend (разбирается после проверки подписи)
      responses:
        "200":
          description: Принято (или повтор известного события)
          content:
            application/json:
              schema:
                type: object
                properties:
                  received: { type: boolean }
                  duplicate: { type: boolean }
                required: [received]
        "400":
          description: |
            `mail_webhook_invalid` — подпись не сходится, timestamp вне
            допуска или тело не разбирается.
          $ref: "#/components/responses/Error"
        "413":
          description: Тело больше 1 МиБ
          $ref: "#/components/responses/Error"
        "503":
          description: |
            `mail_webhook_disabled` — `RESEND_WEBHOOK_SECRET` не задан;
            неподписанные события не принимаются ни при каких условиях.
          $ref: "#/components/responses/Error"
  /v1/admin/mail:
    get:
      tags: [mail]
      summary: Журнал писем (админ)
      description: |
        Keyset-пагинация по `(created_at DESC, id DESC)`; курсор
        непрозрачен для клиента. `q` — подстрока в адресе, теме и
        шаблоне (без учёта регистра). `status` — одно из значений
        стейт-машины письма; мусор → `400 invalid_status`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [queued, sending, sent, delivered, delivery_delayed, bounced, complained, failed, suppressed]
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Страница журнала
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MailItem" }
                  next_cursor:
                    type: string
                    nullable: true
                required: [items]
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/stats:
    get:
      tags: [mail]
      summary: Счётчики писем по статусам за окно
      security: [{ bearerAuth: [] }]
      parameters:
        - name: window_hours
          in: query
          required: false
          schema: { type: integer, default: 24, minimum: 1, maximum: 720 }
      responses:
        "200":
          description: Счётчики
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailStats" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/suppressions:
    get:
      tags: [mail]
      summary: Список подавленных адресов (bounce/complaint/manual)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Адреса, на которые письма не отправляются
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/MailSuppression" }
                required: [items]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/suppressions/{email}:
    delete:
      tags: [mail]
      summary: Снять подавление адреса
      description: |
        Ручное снятие после разбора причины. Идемпотентно: отсутствующий
        адрес → `200 {"removed": false}`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Результат удаления
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed: { type: boolean }
                required: [removed]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/{id}:
    get:
      tags: [mail]
      summary: Письмо целиком + журнал событий доставки
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Письмо и его события
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MailDetail" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "mail_not_found"
          $ref: "#/components/responses/Error"
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/{id}/resend:
    post:
      tags: [mail]
      summary: Повторная отправка письма
      description: |
        Создаёт НОВОЕ письмо с тем же содержимым и ключом
        идемпотентности `<original>:r<n>` — исходная строка журнала не
        меняется (история доставки остаётся честной). Письмо ставится в
        очередь; фактическая отправка — воркером.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Новое письмо в очереди
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
                required: [id, status]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404":
          description: "mail_not_found"
          $ref: "#/components/responses/Error"
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/mail/test:
    post:
      tags: [mail]
      summary: Тестовое письмо (проверка ключа и домена)
      description: |
        Ставит в очередь письмо по шаблону `mail_test`. Без
        `RESEND_API_KEY` работает `NoopMail`: строка журнала создаётся,
        в сеть ничего не уходит (`noop` в отчёте воркера).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to: { type: string, format: email }
              required: [to]
      responses:
        "200":
          description: Письмо в очереди
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [queued] }
                required: [id, status]
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "422":
          description: "`mail_validation_failed` — невалидный адрес"
          $ref: "#/components/responses/Error"
        "503": { $ref: "#/components/responses/Error" }

  # ==========================================================
  # gateway-ws (MVP single-node)
  # ==========================================================
  /v1/ws:
    get:
      tags: [websocket]
      summary: WebSocket live-обновлений (апгрейд)
      description: |
        GET /v1/ws?ticket=… — апгрейд до WS. Билет одноразовый
        (POST /v1/ws/ticket, TTL 30 c, GETDEL-семантика). Первый
        кадр-подписка: {"subscribe":"queue","id":"<session_id>"}
        (DJ: только своя смена) или {"subscribe":"guest","id":"<device>"}
        (гость: только свой канал). Сервер шлёт JSON-события:
        request.created (с title и same_track_count), request.accepted,
        request.rejected (с reason), request.played, session.paused,
        session.resumed. Прод-multi-node: Redis Pub/Sub-релей.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols
        "401":
          $ref: "#/components/responses/Error"

  /v1/club/developers/docs:
    get:
      tags: [club-panel]
      summary: Манифест документации Developer API
      description: |
        Разделы документации, каталог скоупов и пресеты для панели
        «Developers» (ADR-010). Документация встроена в бинарник и
        соответствует контракту `docs/api/openapi-developer.yaml`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Манифест секций, скоупов и пресетов
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/club/developers/docs/{section}:
    get:
      tags: [club-panel]
      summary: Раздел документации Developer API (markdown)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: section
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: "`{id, title, summary, requires, markdown}`"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/club/developers/openapi.json:
    get:
      tags: [club-panel]
      summary: Полный OpenAPI Developer API v1 для панели
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OpenAPI 3.1 как JSON
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  # ==========================================================
  # API-ключи Developer API v1 (ADR-010)
  # ==========================================================
  /v1/club/api-keys:
    get:
      tags: [club-panel]
      summary: Ключи Developer API клуба
      description: |
        Все ключи клуба, включая отозванные (история видна в панели).
        Секрета в ответе нет: в БД хранится только `sha256(plaintext)`,
        полный ключ показывается один раз при создании/ротации.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Список ключей клуба
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKeyView"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [club-panel]
      summary: Создать ключ Developer API
      description: |
        Возвращает полный ключ ровно один раз (`Cache-Control: no-store`).
        Скоупы проверяются по каталогу (неизвестный — 422), лимит — 25
        активных ключей на клуб (409 `key_limit_reached`).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string, examples: ["docs:read", "requests:write"] }
                environment: { type: string, enum: [live, test], default: live }
                expires_in_days:
                  type: integer
                  minimum: 1
                  maximum: 365
                  nullable: true
                  description: Срок жизни; `null`/отсутствие — бессрочный
                rate_limit_per_min:
                  type: integer
                  minimum: 30
                  maximum: 600
                  default: 120
                allowed_cidrs:
                  type: array
                  items: { type: string, examples: ["203.0.113.0/24", "2001:db8::/32"] }
      responses:
        "201":
          description: Ключ создан; `key` показан один раз
          headers:
            Cache-Control:
              description: "`no-store`: секрет нельзя кэшировать"
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyCreated"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/api-keys/scopes:
    get:
      tags: [club-panel]
      summary: Каталог скоупов и пресеты для панели
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Каталог скоупов и пресеты выбора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyScopes"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/club/api-keys/{id}:
    get:
      tags: [club-panel]
      summary: Карточка ключа
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Карточка без секрета
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyView"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    patch:
      tags: [club-panel]
      summary: Переименовать ключ или сузить скоупы
      description: |
        Скоупы можно только сузить: расширение отклоняется
        `422 scope_widening_forbidden` (повышение прав — новый ключ).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                scopes:
                  type: array
                  minItems: 1
                  items: { type: string }
      responses:
        "200":
          description: Обновлённая карточка
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyView"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    delete:
      tags: [club-panel]
      summary: Отозвать ключ
      description: Мгновенный отзыв; повторный отзыв — `404`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Ключ отозван }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/api-keys/{id}/rotate:
    post:
      tags: [club-panel]
      summary: Ротировать ключ (новый секрет, окно перекрытия)
      description: |
        Создаёт новый ключ с теми же правами и возвращает его секрет один
        раз. Старый секрет живёт ещё `grace_hours` (0..=72, по умолчанию 24)
        и затем отвечает `401 api_key_expired`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_hours: { type: integer, minimum: 0, maximum: 72, default: 24 }
      responses:
        "201":
          description: Новый ключ; `key` показан один раз
          headers:
            Cache-Control:
              description: "`no-store`: секрет нельзя кэшировать"
              schema: { type: string, enum: ["no-store"] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyRotated"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/api-keys/{id}/usage:
    get:
      tags: [club-panel]
      summary: Сводка и журнал вызовов ключа
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сводка за 24 ч/30 дней и последние вызовы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyUsage"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/api-keys:
    get:
      tags: [admin-panel]
      summary: Все ключи платформы (read-only обзор)
      description: |
        Ключи всех клубов с названием владельца. Админ видит карточки без
        секрета и может отозвать любой ключ через
        `POST /v1/admin/api-keys/{id}/revoke`.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Список ключей с клубом-владельцем
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminApiKeyView"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/api-keys/scopes:
    get:
      tags: [admin-panel]
      summary: Каталог скоупов и пресеты (админ)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Каталог скоупов и пресеты выбора
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyScopes"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /v1/admin/api-keys/{id}/revoke:
    post:
      tags: [admin-panel]
      summary: Отозвать любой ключ платформы
      description: |
        Инцидент/утечка: админ гасит ключ независимо от клуба-владельца.
        Действие пишется в `audit_log` как `api_key.revoked` (actor admin).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Ключ отозван }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/api-keys/{id}/usage:
    get:
      tags: [admin-panel]
      summary: Сводка и журнал вызовов любого ключа
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Сводка за 24 ч/30 дней и последние вызовы
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyUsage"
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/status/services:
    get:
      tags: [health]
      summary: Публичный статус сервисов (страница /status/)
      description: |
        Публичный JSON для страницы `/status/`: только список сервисов и их
        состояние для людей («работает / с задержками / недоступно»).
        Внутренние детали (Redis, outbox, heartbeat воркеров, схема,
        задержки) намеренно не раскрываются — они доступны админу на
        `GET /v1/admin/status/services`.
      security: []
      responses:
        "200":
          description: Состояние сервисов
          content:
            application/json:
              schema:
                type: object
                required: [status, checked_at, services]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded, down]
                  checked_at:
                    type: string
                    format: date-time
                  services:
                    type: array
                    items:
                      type: object
                      required: [id, name, state, note]
                      properties:
                        id: { type: string }
                        name: { type: string }
                        state: { type: string, enum: [ok, degraded, down, unknown] }
                        note: { type: string }
  /v1/admin/status/services:
    get:
      tags: [admin-panel]
      summary: Полный технический статус подсистем (только админ)
      description: |
        Детальные проверки для операторов: имена подсистем, возраст
        heartbeat, размер outbox, схема БД, режим платежей и версия.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Детальный статус
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access-JWT (15 мин), role в клеймах
    deviceToken:
      type: http
      scheme: bearer
      description: device-token гостя (UUIDv7, не JWT)
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      required: [status]
    Ready:
      type: object
      description: |
        Ответ `/readyz`. `open_signup` и `payments` — источник правды для
        полосы режима работы «Test mode · open signup · mock payments»:
        один и тот же бандл сегодня
        стоит на стенде, а завтра в проде, поэтому режим определяет сервер,
        а не сборка. Значения правдивые, а не декоративные.
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Версия gateway (`CARGO_PKG_VERSION`)
        open_signup:
          type: boolean
          description: |
            `DROPIT_OPEN_SIGNUP` включён — публичная регистрация клуба/DJ
            работает (признак Test Mode)
        payments:
          type: string
          enum: [mock, live]
          description: |
            `live` — заданы ключи Stripe (`dropit_infra_stripe::from_env()`);
            `mock` — платежи имитируются
      required: [status, version, open_signup, payments]
    Status:
      type: object
      description: |
        Ответ `GET /v1/status`. `mode` — эффективный режим для нижнего
        статус-бара панелей, `source` — откуда он взялся (ручная настройка
        админа, env-флаг или адаптивные факты стенда), `runtime_mode` —
        сырое значение настройки в БД (при недоступной БД — `"auto"`).
      properties:
        mode:
          type: string
          enum: [test, maintenance, normal]
          description: |
            `test` — тестовый стенд (открытая регистрация или mock-платежи),
            `maintenance` — обслуживание, `normal` — боевой режим
        source:
          type: string
          enum: [admin, env, adaptive]
          description: |
            `admin` — режим задан в админ-панели; `env` — включён
            `DROPIT_MAINTENANCE`; `adaptive` — выведен из фактов стенда
        runtime_mode:
          type: string
          enum: [auto, test, maintenance, normal]
          description: |
            Сырое значение `platform_settings.runtime_mode`; `"auto"` —
            ручного решения нет (режим разрешён по шагам 2/3)
        open_signup:
          type: boolean
          description: |
            `DROPIT_OPEN_SIGNUP` включён (признак Test Mode)
        payments:
          type: string
          enum: [mock, live]
          description: |
            `live` — заданы ключи Stripe (`dropit_infra_stripe::from_env()`);
            `mock` — платежи имитируются
      required: [mode, source, runtime_mode, open_signup, payments]
    PasswordResetRequested:
      type: object
      description: |
        Ответ `POST /v1/auth/password/reset-request`. `requested` есть всегда;
        `reset_url` и `expires_at` — ТОЛЬКО при включённом
        `DROPIT_RESET_REVEAL_TOKEN` и существующем аккаунте (Test Mode без
        мейлера). В проде полей нет, и ответ неотличим от ответа на
        неизвестный адрес.
      properties:
        requested:
          type: boolean
          enum: [true]
        reset_url:
          type: string
          description: |
            Относительная ссылка `/reset-password/<token>` (Test Mode:
            стенд без SMTP). В проде отсутствует.
          examples: [/reset-password/9f2c…]
        expires_at:
          type: string
          format: date-time
          description: |
            Срок жизни токена (RFC3339, TTL 30 минут). Только вместе с
            `reset_url`.
      required: [requested]
    OnboardingApplyRequest:
      type: object
      description: |
        Тело публичной заявки. Секретов не принимает: лишние поля (в том
        числе гипотетический `password`) игнорируются и никуда не пишутся.
      required: [club, venue, qr]
      properties:
        club:
          type: object
          required: [name, contact]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            city: { type: string, maxLength: 200 }
            address: { type: string, maxLength: 200 }
            website:
              type: string
              maxLength: 300
              description: http(s)-URL или пустая строка
            contact:
              type: string
              minLength: 1
              maxLength: 120
              description: E-mail или телефон; e-mail попадает в `email`
            genres:
              type: array
              maxItems: 8
              items: { type: string, maxLength: 40 }
        venue:
          type: object
          required: [name, capacity]
          properties:
            name: { type: string, minLength: 1, maxLength: 120 }
            type: { type: string, maxLength: 60 }
            address: { type: string, maxLength: 200 }
            city: { type: string, maxLength: 200 }
            district: { type: string, maxLength: 120 }
            capacity: { type: integer, minimum: 1, maximum: 100000 }
            seats: { type: integer, minimum: 0 }
            area_m2: { type: integer, minimum: 0, maximum: 100000 }
        qr:
          type: object
          description: |
            QR-блок. Цена необязательна: компактная форма `/register` её не
            спрашивает (клуб задаёт тариф в панели после активации), визард
            `/connect` присылает.
          properties:
            price_minor:
              type: integer
              nullable: true
              minimum: 100
              maximum: 100000
              description: Цена запроса в минорных единицах; нет цены — `null`
            zones:
              type: array
              maxItems: 12
              items: { type: string, maxLength: 60 }
    OnboardingApplyResponse:
      type: object
      required: [application_id, status, submitted_at]
      properties:
        application_id: { type: string, format: uuid }
        status: { type: string, enum: [pending_moderation] }
        submitted_at: { type: string, format: date-time }
    ClubInvitePreview:
      type: object
      description: Публичные данные ссылки активации клуба (без секретов).
      required: [club_name, email, contact, slug, expires_at]
      properties:
        club_name: { type: string }
        city:
          type: string
          nullable: true
        email: { type: string, format: email }
        contact: { type: string, description: Контакт из заявки (телефон или e-mail) }
        slug: { type: string }
        expires_at: { type: string, format: date-time }
    OnboardingClub:
      type: object
      required: [id, name, slug, email]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        email: { type: string, format: email }
    ClubInviteAcceptResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          required: [club]
          properties:
            club: { $ref: "#/components/schemas/OnboardingClub" }
    OnboardingInviteState:
      type: string
      enum: [none, pending, accepted, expired]
      description: |
        Состояние invite-ссылки клуба, выводимое из `club`:
        `none` — клуба ещё нет; `accepted` — `invite_token_hash IS NULL`
        (пароль задан); `pending` — срок в будущем; `expired` — срок вышел.
    OnboardingApplicationRow:
      type: object
      required: [id, club_name, city, contact, price_minor, status, created_at, club_id, invite_state]
      properties:
        id: { type: string, format: uuid }
        club_name: { type: string }
        city: { type: string }
        contact: { type: string }
        price_minor: { type: integer }
        status: { type: string, enum: [pending_moderation, approved, rejected] }
        created_at: { type: string, format: date-time }
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        club_id:
          type: string
          format: uuid
          nullable: true
          description: null, пока заявка не одобрена
        invite_state: { $ref: "#/components/schemas/OnboardingInviteState" }
    OnboardingApplicationPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/OnboardingApplicationRow" }
        next_cursor:
          type: string
          nullable: true
    OnboardingApplicationDetail:
      type: object
      required: [id, club_name, city, contact, price_minor, status, created_at, club_id, invite_state]
      properties:
        id: { type: string, format: uuid }
        club:
          type: object
          description: Исходный клубный блок заявки как есть
        venue:
          type: object
        qr:
          type: object
        club_name: { type: string }
        city: { type: string }
        contact: { type: string }
        email:
          type: string
          format: email
          nullable: true
        price_minor: { type: integer }
        status: { type: string, enum: [pending_moderation, approved, rejected] }
        reject_reason:
          type: string
          nullable: true
        reviewed_by:
          type: string
          format: uuid
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        source_ip: { type: string }
        club_id:
          type: string
          format: uuid
          nullable: true
        invite_state: { $ref: "#/components/schemas/OnboardingInviteState" }
    OnboardingApproveRequest:
      type: object
      description: Все поля необязательны; пустое тело — валидный approve.
      properties:
        email:
          type: string
          format: email
          description: По умолчанию `club_application.email`
        slug:
          type: string
          minLength: 2
          maxLength: 60
          description: "[a-z0-9-]; иначе генерируется из названия"
        password:
          type: string
          minLength: 8
          maxLength: 128
          deprecated: true
          description: |
            Устарело: новый поток пароль не принимает. Если передан —
            сохраняется прежнее поведение (Argon2id + рабочий вход).
    OnboardingApproveResponse:
      type: object
      required: [application_id, club_id, status, email, invite_url, invite_expires_at, mail_queued]
      properties:
        application_id: { type: string, format: uuid }
        club_id: { type: string, format: uuid }
        status: { type: string, enum: [approved] }
        email: { type: string, format: email }
        invite_url: { type: string, format: uri }
        invite_expires_at: { type: string, format: date-time }
        mail_queued:
          type: boolean
          description: true — строка письма `club_invite` реально в очереди
        qr_master_token:
          type: string
          description: Master-токен админского входа клуба (plaintext, один раз)
    OnboardingReissueResponse:
      type: object
      required: [invite_url, invite_expires_at, email, mail_queued]
      properties:
        invite_url: { type: string, format: uri }
        invite_expires_at: { type: string, format: date-time }
        email: { type: string, format: email }
        mail_queued: { type: boolean }
    DjInvitePreview:
      type: object
      description: Публичные данные приглашения DJ (`/dj/invite/:token`).
      required: [display_name, club_name, expires_at]
      properties:
        display_name: { type: string }
        club_name: { type: string }
        expires_at: { type: string, format: date-time }
    ErrorEnvelope:
      type: object
      description: Единый формат ошибок; code — стабильный i18n-ключ
      properties:
        code:
          type: string
          examples: [session_closed, rate_limited, forbidden]
        message:
          type: string
        details:
          description: Опциональные детали
      required: [code, message]
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: TTL access-токена, сек
      required: [access_token, refresh_token, token_type, expires_in]
    MasterLoginResponse:
      type: object
      description: |
        Ответ `POST /v1/auth/club/master`. Формат ОТЛИЧАЕТСЯ от `TokenPair`:
        master-вход отдаёт `club_id` и `role`, и НЕ отдаёт `token_type`
        (контракт W5-C).
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: TTL access-токена, сек
        club_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [club]
      required: [access_token, refresh_token, expires_in, club_id, role]
    RegisteredClub:
      type: object
      description: Клуб, созданный открытой регистрацией (Test Mode).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
          description: Уникальный slug из имени (`[a-z0-9-]`, суффикс `-2`, `-3` при коллизии)
        email:
          type: string
          format: email
      required: [id, name, slug, email]
    RegisteredDj:
      type: object
      description: DJ, созданный открытой регистрацией (Test Mode).
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        club_id:
          type: string
          format: uuid
          nullable: true
          description: null — фрилансер (без `club_slug` в запросе)
      required: [id, display_name, email]
    ClubRegisterResponse:
      type: object
      description: |
        Ответ `POST /v1/auth/club/register`: пара токенов как у логина
        (`TokenPair` развёрнут в корень) + доп. поле `club`.
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            club:
              $ref: "#/components/schemas/RegisteredClub"
          required: [club]
    DjRegisterResponse:
      type: object
      description: |
        Ответ `POST /v1/auth/dj/register`: пара токенов как у логина
        (`TokenPair` развёрнут в корень) + доп. поле `dj`.
      allOf:
        - $ref: "#/components/schemas/TokenPair"
        - type: object
          properties:
            dj:
              $ref: "#/components/schemas/RegisteredDj"
          required: [dj]
    QrToggleResponse:
      type: object
      description: |
        Ответ `POST /v1/club/sessions/{id}/qr/activate` и `/deactivate`.
        Обязательны только `session_id` и `qr_active` (правдивое
        состояние БД). При первичной активации (выпуске нового токена,
        когда рабочего QR нет) дополнительно возвращаются `qr_token`
        (plain, показывается клубу один раз) и `expires_at`; при
        идемпотентном повторном activate и при deactivate эти поля
        опускаются.
      properties:
        session_id:
          type: string
          format: uuid
        qr_active:
          type: boolean
          description: true — приём гостей по QR открыт; false — закрыт
        qr_token:
          type: string
          description: Новый QR-токен (только при первичной активации)
        expires_at:
          type: string
          format: date-time
          description: Плановое авто-закрытие (только при первичной активации)
      required: [session_id, qr_active]
    TotpChallenge:
      type: object
      properties:
        mfa_required:
          type: boolean
          enum: [true]
      required: [mfa_required]
    EchoResponse:
      type: object
      description: Ответ RBAC-эхо-роутов (роль + subject)
      properties:
        role:
          type: string
        sub:
          type: string
          format: uuid
      required: [role, sub]
    JoinResponse:
      type: object
      description: Ответ /v1/sessions/join
      properties:
        test_payments:
          type: boolean
          description: Сервер использует MockStripe; доступна тестовая оплата без карты и списания
        session_id:
          type: string
          format: uuid
        club_name:
          type: string
        dj_display_name:
          type: string
          description: null до назначения DJ
        status:
          type: string
          enum: [created, active, paused_acceptance]
        timezone:
          type: string
        price_minor:
          type: integer
          description: Цена запроса из действующей политики (минорные единицы)
        grant_id:
          type: string
          format: uuid
          description: Грант session_guest; основание для POST /requests (F4)
      required: [session_id, club_name, status, timezone, grant_id]
    CurrentSessionEnvelope:
      type: object
      description: Ответ GET /v1/sessions/current
      properties:
        session:
          $ref: "#/components/schemas/CurrentSessionResponse"
      required: [session]
    CurrentSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        club_id:
          type: string
          format: uuid
        club_name:
          type: string
        club_city:
          type: string
        opened_at:
          type: string
          format: date-time
        closes_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        requests_open:
          type: boolean
        dj:
          anyOf:
            - $ref: "#/components/schemas/CurrentSessionDj"
            - type: "null"
        guest_grant_expires_at:
          type: string
          format: date-time
      required: [id, club_id, club_name, club_city, opened_at, requests_open, guest_grant_expires_at]
    CurrentSessionDj:
      type: object
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
      required: [id, display_name]
    CatalogHit:
      type: object
      description: Нормализованный результат поиска трека (носитель-агностический)
      properties:
        source:
          type: string
          description: Имя источника в нижнем регистре (itunes/deezer)
        source_id:
          type: string
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        duration_ms:
          type: integer
        isrc:
          type: string
        artwork_url:
          type: string
        preview_url:
          type: string
        source_url:
          type: string
        explicit:
          type: boolean
      required: [source, source_id, title, artist, duration_ms, explicit]
    QueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
      required: [items]
    QueueItem:
      type: object
      description: Карточка запроса в очереди DJ / списке гостя
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, played, expired]
        style:
          anyOf:
            - type: string
            - type: "null"
        created_at:
          type: string
          format: date-time
        title:
          type: string
        artist:
          type: string
        cover_url:
          anyOf:
            - type: string
            - type: "null"
        preview_url:
          anyOf:
            - type: string
            - type: "null"
        isrc:
          anyOf:
            - type: string
            - type: "null"
        same_track_count:
          type: integer
          description: Сколько раз эту же песню (canonical-ключ) запросили в сессии
      required: [id, status, created_at, title, artist, same_track_count]
    MyRequestDetail:
      type: object
      description: Ответ GET /v1/my/requests/{id}
      properties:
        request:
          $ref: "#/components/schemas/RequestDetail"
      required: [request]
    RequestDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, played, expired]
        track:
          type: object
          properties:
            title:
              type: string
            artist:
              type: string
            artwork_url:
              type: string
          required: [title, artist]
        position:
          anyOf:
            - type: integer
            - type: "null"
          description: Место в очереди (только для pending; иначе null)
        queue_size:
          type: integer
        same_song_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        played_at:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        decline_reason:
          type: string
      required: [id, session_id, status, track, queue_size, same_song_count, created_at, updated_at]
    ActionResult:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
        noop:
          type: boolean
          description: true — повтор действия уже выполненного (no-op)
      required: [request_id, status, noop]
    SessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, active, paused_acceptance, closed]
        timezone:
          type: string
        dj_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required: [id, status, timezone]
    MailStatus:
      type: string
      description: |
        Стейт-машина письма. Переходы монотонны: позднее `sent` не
        откатывает уже `delivered`.
      enum: [queued, sending, sent, delivered, delivery_delayed, bounced, complained, failed, suppressed]
    MailItem:
      type: object
      description: Строка журнала писем (без тела письма).
      properties:
        id: { type: string, format: uuid }
        to: { type: string, format: email }
        to_name:
          type: string
          nullable: true
        subject: { type: string }
        template:
          type: string
          enum: [dj_invite, guest_verify, payout_paid, mail_test]
        status: { $ref: "#/components/schemas/MailStatus" }
        attempts: { type: integer }
        max_attempts: { type: integer }
        provider_id:
          type: string
          nullable: true
          description: Идентификатор письма у провайдера (Resend)
        last_error:
          type: string
          nullable: true
          description: Причина последней неудачи (санитизированная, без секретов)
        aggregate_type:
          type: string
          nullable: true
        aggregate_id:
          type: string
          format: uuid
          nullable: true
        created_at: { type: string, format: date-time }
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
      required: [id, to, subject, template, status, attempts, created_at]
    MailDetail:
      allOf:
        - $ref: "#/components/schemas/MailItem"
        - type: object
          properties:
            html:
              type: string
              description: Отрисованный HTML (показывать только в sandboxed iframe)
            text: { type: string }
            vars:
              type: object
              description: Переменные шаблона на момент отправки
            events:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  type: { type: string, examples: [email.delivered] }
                  received_at: { type: string, format: date-time }
                required: [id, type, received_at]
          required: [html, text, events]
    MailStats:
      type: object
      description: Счётчики писем по статусам за окно (по умолчанию 24 ч).
      properties:
        window_hours: { type: integer }
        queued: { type: integer }
        sending: { type: integer }
        sent: { type: integer }
        delivered: { type: integer }
        bounced: { type: integer }
        complained: { type: integer }
        failed: { type: integer }
        suppressed: { type: integer }
        total: { type: integer }
      required: [window_hours, queued, sending, sent, delivered, bounced, complained, failed, suppressed, total]
    MailSuppression:
      type: object
      description: Адрес, на который письма не отправляются.
      properties:
        email: { type: string, format: email }
        reason:
          type: string
          enum: [bounce, complaint, manual]
        detail:
          type: string
          nullable: true
        created_at: { type: string, format: date-time }
      required: [email, reason, created_at]
    ApiKeyView:
      type: object
      description: |
        Карточка API-ключа Developer API v1. Секрета здесь нет — в БД
        хранится только `sha256(plaintext)`, полный ключ отдаётся один раз
        при создании/ротации. `prefix` — публичный идентификатор для логов
        и поддержки.
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        prefix: { type: string, description: 10 hex-символов, публичный id }
        environment: { type: string, enum: [live, test] }
        scopes:
          type: array
          items: { type: string, examples: ["docs:read", "requests:write"] }
        status: { type: string, enum: [active, revoked] }
        rate_limit_per_min: { type: integer, minimum: 30, maximum: 600 }
        allowed_cidrs:
          type: array
          items: { type: string, examples: ["203.0.113.0/24"] }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        rotated_from: { type: string, format: uuid, nullable: true }
        expired: { type: boolean, description: Истёк ли срок на момент ответа }
      required: [id, name, prefix, environment, scopes, status, rate_limit_per_min, allowed_cidrs, created_at, expired]
    ApiKeyCreated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          properties:
            key:
              type: string
              description: Полный ключ `dit_<env>_<prefix>_<secret>`; показан один раз
            warning: { type: string }
          required: [key, warning]
    ApiKeyRotated:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          properties:
            key:
              type: string
              description: Полный новый ключ; показан один раз
            replaces:
              type: string
              format: uuid
              description: id заменённого ключа (окно перекрытия `grace_hours`)
          required: [key, replaces]
    ApiKeyScopes:
      type: object
      description: Каталог скоупов и пресеты выбора для панели Developers.
      properties:
        scopes:
          type: array
          items:
            type: object
            properties:
              id: { type: string, examples: ["docs:read"] }
              title: { type: string }
              description: { type: string }
              group: { type: string }
              risk: { type: string, enum: [read, write, sensitive] }
              docs_section: { type: string }
            required: [id, title, description, group, risk, docs_section]
        presets:
          type: array
          items:
            type: object
            properties:
              id: { type: string, examples: ["read-only"] }
              title: { type: string }
              description: { type: string }
              scopes:
                type: array
                items: { type: string }
            required: [id, title, description, scopes]
      required: [scopes, presets]
    ApiKeyUsage:
      type: object
      description: Журнал вызовов ключа (хранится 30 дней).
      properties:
        summary:
          type: object
          properties:
            calls_24h: { type: integer }
            errors_24h: { type: integer }
            calls_30d: { type: integer }
            last_call_at: { type: string, format: date-time, nullable: true }
          required: [calls_24h, errors_24h, calls_30d, last_call_at]
        items:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              method: { type: string }
              path: { type: string }
              status: { type: integer }
            required: [at, method, path, status]
      required: [summary, items]
    AdminApiKeyView:
      allOf:
        - $ref: "#/components/schemas/ApiKeyView"
        - type: object
          properties:
            club_name: { type: string, description: Клуб-владелец ключа }
          required: [club_name]
  responses:
    Error:
      description: Ошибка с единым envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
