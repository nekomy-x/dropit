openapi: 3.1.0
info:
  title: DROP IT API
  version: 0.7.0
  description: |
    Контракт (F0A → F2). Реальные пути добавляются по фазам:
    F1 ✅, F2 ✅, F4 ✅, F5 ✅, F6 ✅, panel endpoints ✅, F3 — catalog,
    F5 — payments. Breaking changes блокируются CI (oasdiff).
  contact:
    name: DROP IT
servers:
  - url: http://127.0.0.1:8080
    description: local dev
tags:
  - name: health
    description: Проверки живости/готовности
  - name: identity
    description: Устройство гостя, логины, 2FA, refresh, RBAC-эхо
  - name: sessions
    description: Сессии, QR-ротация, join гостя, текущая сессия
  - name: requests
    description: Запросы треков, очередь гостя, действия DJ
  - name: payments
    description: Платежи и вебхуки Stripe
  - name: payouts
    description: Выплаты, сверка, инциденты
  - name: club-panel
    description: Панель клуба (дашборд, профиль, тарифы, DJ, Stripe)
  - name: admin-panel
    description: Панель админа (клубы, гости, платежи, аудит, настройки)
  - name: dj
    description: Смена и статистика DJ, стили профиля
  - name: catalog
    description: Поиск трека во внешнем каталоге
  - name: guest
    description: Профиль гостя (push-токен, upgrade)
  - name: websocket
    description: Live-обновления и одноразовые билеты WS
  - name: mail
    description: |
      Транзакционные письма через Resend (ADR-008): журнал, повторная
      отправка, подавления, вебхуки доставки. Отправка выполняется
      воркером `dropit-workers` (задача `mail`), не в обработчике запроса.
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      security: []
      responses:
        "200":
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      tags: [health]
      summary: Readiness
      security: []
      description: |
        Процесс готов принимать трафик. Дополнительно отдаёт два честных
        факта о стенде — их читает полоса режима работы
        «Test mode · open signup · mock payments» в панелях
        (`packages/ui/DeploymentStatus.tsx`):

          * `open_signup` — тот же флаг, что пускает
            `/v1/auth/{club,dj}/register` (`DROPIT_OPEN_SIGNUP`);
          * `payments` — `"live"`, если заданы ключи Stripe
            (`dropit_infra_stripe::from_env()`), иначе `"mock"`.

        `/healthz` не менялся и остаётся минимальным.
      responses:
        "200":
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
  /v1/status:
    get:
      tags: [health]
      summary: Режим эксплуатации стенда (test / maintenance / normal)
      security: []
      description: |
        Публичный роут без авторизации: панели опрашивают его один раз при
        загрузке страницы, чтобы нарисовать нижний статус-бар. Один и тот же
        бандл стоит на тестовом стенде и в проде, поэтому режим определяет
        сервер, а не сборка.

        Порядок разрешения (контракт):

          1. `platform_settings.runtime_mode` != `auto` и строка прочитана →
             этот режим, `source = "admin"`;
          2. `auto` (или БД недоступна) и `DROPIT_MAINTENANCE` включён
             (`1`/`true`/`yes`/`on`) → `maintenance`, `source = "env"`;
          3. иначе адаптивно: открытая регистрация или mock-платежи →
             `test`, иначе `normal`, `source = "adaptive"`.

        Недоступная БД НЕ валит эндпоинт: ответ всегда `200`, `runtime_mode`
        тогда `"auto"`, а режим берётся из шагов 2/3.
      responses:
        "200":
          description: Разрешённый режим стенда
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"

  # ==========================================================
  # F1 — identity
  # ==========================================================
  /v1/guest/device:
    post:
      tags: [identity]
      summary: Выдать device-token гостя
      security: []
      description: |
        Без регистрации. Лимит 5/час/IP (B: антифрод-флуд); выше —
        captcha (F8). IP определяется так:
          * `TRUST_PROXY=1|true|yes` (прод за nginx) — первый хоп
            `X-Forwarded-For` (до запятой) / `X-Real-IP`;
          * иначе (БЕЗОПАСНЫЙ ДЕФОЛТ — доверие ВЫКЛ, включая отсутствие
            переменной и `0`) — заголовки игнорируются, используется
            прямой адрес подключения (`ConnectInfo<SocketAddr>`), а при
            его недоступности — единый бакет `0.0.0.0` (глобальный лимит).
        Дефолт выключен, чтобы при прямом подключении (без nginx) атакующий
        не обходил лимит подменой `X-Forwarded-For`. В проде за nginx
        выставьте `TRUST_PROXY=1` и
        `proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;`.
        Коды ответов не изменились.
        Device-token = UUIDv7 guest_device.id; передаётся как Bearer
        в гостевых роутах (не JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [ios, android, web]
                app_version:
                  type: string
      responses:
        "200":
          description: Device-token выдан
          content:
            application/json:
              schema:
                type: object
                required: [device_token]
                properties:
                  device_token:
                    type: string
                    format: uuid
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/{role}/login:
    post:
      tags: [identity]
      summary: Логин DJ/клуба/админа (шаг 1 — пароль)
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [dj, club, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: |
            Либо пара токенов (2FA не настроена), либо требование 2FA.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/TotpChallenge"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/{role}/2fa:
    post:
      tags: [identity]
      summary: Логин (шаг 2 — TOTP-код)
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [dj, club, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, totp_code]
              properties:
                email:
                  type: string
                  format: email
                totp_code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        "200":
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      tags: [identity]
      summary: Ротация refresh-токена
      security: []
      description: |
        Каждый refresh аннулирует предыдущий токен (семья).
        Reuse отозванного токена = кража → ревок всей семьи.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/club/master:
    post:
      tags: [identity]
      summary: Вход клуба по master-токену (qr_master_token)
      security: []
      description: |
        Единственный способ входа в клуб-панель: клуб, созданный через
        `POST /v1/admin/clubs`, не имеет пароля (`password_hash='!'`),
        поэтому `/v1/auth/club/login` ему недоступен. Сверка
        `sha256(token)` с `club.qr_master_token_hash` в постоянном
        времени; JWT выдаётся тем же кодом, что обычный логин клуба.
        Формат ответа ОТЛИЧАЕТСЯ от `TokenPair`: master-вход отдаёт
        `club_id` и `role`, и НЕ отдаёт `token_type` (контракт W5-C).
        Токен НЕ логируется; в `audit_log` пишется `club_master_login`.
        Лимит 10 неудач / 15 мин по IP (считается ДО сверки — иначе
        флуд валидных по формату, но неверных токенов брутфорсит хеш).
        Коды ошибок: 400 `invalid_request`, 401 `invalid_credentials`
        (неверный токен или заблокированный клуб), 429 `too_many_attempts`,
        503 `external_unavailable`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_master_token]
              properties:
                qr_master_token:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: Постоянный токен входа клуба (128 бит, hex)
      responses:
        "200":
          description: Пара JWT + идентификация клуба
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterLoginResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # Открытая регистрация (Test Mode stand) — docs/signup-contract.md
  # ==========================================================
  /v1/auth/club/register:
    post:
      tags: [identity]
      summary: Открытая регистрация клуба (без 2FA и подтверждения e-mail)
      security: []
      description: |
        Публичный роут (без auth). Работает только при
        `DROPIT_OPEN_SIGNUP=1|true|yes|on`; иначе `403 signup_disabled`.
        Флаг читается при старте процесса — включение/выключение это
        перезапуск gateway.

        В Test Mode аккаунт сразу рабочий: `club.status='active'` (без
        верификации админом), поэтому `POST /v1/auth/club/login` сразу
        возвращает пару токенов без шага 2FA.

        Ответ — сразу пара токенов (авто-логин) в том же формате, что у
        логина (`TokenPair` развёрнут в корень), плюс доп. поле `club`
        (клиенты могут игнорировать). Refresh-токен сохраняется в
        `refresh_token` (новая семья), поэтому ротация и reuse-детекция
        `/v1/auth/refresh` работают как после логина.

        `slug` генерируется из `name` (транслит → `[a-z0-9-]`); при
        коллизии `UNIQUE(slug)` добавляется суффикс `-2`, `-3`, … Лимит:
        `DROPIT_SIGNUP_RATE_PER_HOUR` регистраций с одного IP за час
        (дефолт 10; на Test Mode стенде — 100, потому что несколько
        посетителей за одним NAT выжигают малый бюджет за минуты).
        Учёт в БД, таблица `signup_attempt` (миграция 0011); IP
        определяется так же, как в `POST /v1/guest/device`
        (`TRUST_PROXY=1` за nginx). Счётчик fail-open: если таблицы нет
        (бинарник приехал раньше миграции), регистрация продолжает
        работать, инцидент пишется в warn-лог.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  examples: [Barrio Latino]
                email:
                  type: string
                  format: email
                  description: Сравнивается без учёта регистра (citext)
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Argon2id, как в логине
                city:
                  type: string
                  description: Необязательно
                country:
                  type: string
                  pattern: '^[A-Za-z]{2}$'
                  description: ISO-3166 alpha-2, необязательно
      responses:
        "201":
          description: Клуб создан (status=active), выдана пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubRegisterResponse"
        "400":
          description: Ошибка валидации (`validation_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Регистрация выключена (`signup_disabled`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: E-mail уже занят (`email_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: |
            Превышен `DROPIT_SIGNUP_RATE_PER_HOUR` регистраций с IP за час
            (`rate_limited`; дефолт 10, на стенде 100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/dj/register:
    post:
      tags: [identity]
      summary: Открытая регистрация DJ (фрилансер или привязка к клубу)
      security: []
      description: |
        Публичный роут (без auth). Гейт — тот же `DROPIT_OPEN_SIGNUP`
        (иначе `403 signup_disabled`). DJ создаётся `status='active'`.

        Без `club_slug` — фрилансер (`club_id = null`); DJ-консоль увидит
        только сессии, к которым привязан (в Test Mode допустимо). С
        `club_slug` — привязка к клубу; неизвестный slug →
        `404 club_not_found`.

        Ответ — пара токенов (как у логина, `TokenPair` в корне) плюс
        доп. поле `dj`. Лимит `DROPIT_SIGNUP_RATE_PER_HOUR` (дефолт 10,
        стенд — 100) регистраций/IP/час общий с регистрацией клуба.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, email, password]
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  examples: [DJ Noche]
                email:
                  type: string
                  format: email
                  description: Сравнивается без учёта регистра (citext)
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                club_slug:
                  type: string
                  description: Slug клуба для привязки; без него — фрилансер
                  examples: [barrio-latino]
      responses:
        "201":
          description: DJ создан (status=active), выдана пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DjRegisterResponse"
        "400":
          description: Ошибка валидации (`validation_failed`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Регистрация выключена (`signup_disabled`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Клуб по `club_slug` не найден (`club_not_found`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: E-mail уже занят (`email_taken`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: |
            Превышен `DROPIT_SIGNUP_RATE_PER_HOUR` регистраций с IP за час
            (`rate_limited`; дефолт 10, на стенде 100)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          $ref: "#/components/responses/Error"

  /v1/auth/admin/register:
    post:
      tags: [identity]
      summary: Публичная регистрация админа — запрещена
      security: []
      description: |
        Админ публично НЕ регистрируется (только seed/админка). Роут
        существует, чтобы клиент получал внятный `403 forbidden`, а не
        404. Тело не читается; ответ одинаков при любом теле.
      responses:
        "403":
          description: Всегда `forbidden`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ==========================================================
  # Сброс пароля (клуб / DJ / админ) — Test Mode stand без почты
  # ==========================================================
  /v1/auth/password/reset-request:
    post:
      tags: [identity]
      summary: Запросить ссылку сброса пароля
      security: []
      description: |
        Публичный роут (без auth): пароль забыт именно потому, что войти
        нечем. `role` — `club` | `dj` | `admin`, по умолчанию `club`
        (фронт присылает его всегда): одно и то же имя ящика может
        существовать в разных таблицах, роль — часть ключа поиска.

        Ответ ВСЕГДА `202 {requested:true}`, когда тело корректно — и для
        несуществующего адреса тоже (no user enumeration: иначе форма
        превращается в оракул «есть ли у вас аккаунт»). `400` — только
        пустой/кривой e-mail или неизвестная роль.

        Лимит: 5 запросов в час на адрес И на IP (таблица
        `password_reset_token`, миграция 0015); шестой → `429
        rate_limited`. Считаются только запросы, по которым выпущен токен
        (на неизвестный адрес строка не пишется — ответ от этого не
        меняется).

        ## Test Mode: ссылка в теле ответа

        В репозитории нет мейлера в пути сброса. Поэтому при
        `DROPIT_RESET_REVEAL_TOKEN=1|true|yes|on` и существующем аккаунте
        тело `202` ДОПОЛНИТЕЛЬНО содержит `reset_url`
        (`/reset-password/<token>`) и `expires_at` (RFC3339, TTL 30 минут).
        Флаг читается на каждом запросе.

        **Прод обязан работать с выключенным флагом и настоящим мейлером**:
        `reset_url` в ответе — это выдача токена сброса любому, кто знает
        адрес, то есть обход модели безопасности. При выключенном флаге
        оба поля отсутствуют, и ответ неотличим от ответа на неизвестный
        адрес. Ссылка (без пароля) в любом случае пишется в
        `tracing::info!`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Сравнивается без учёта регистра (citext)
                  examples: [owner@club.test]
                role:
                  type: string
                  enum: [club, dj, admin]
                  default: club
                  description: |
                    Тип аккаунта. Неизвестное значение (в т.ч. `guest`) →
                    `400 validation_failed`.
      responses:
        "202":
          description: |
            Запрос принят. `reset_url`/`expires_at` — только при включённом
            `DROPIT_RESET_REVEAL_TOKEN` и существующем аккаунте (Test Mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetRequested"
        "400":
          description: |
            Ошибка валидации (`validation_failed`): пустой/кривой e-mail или
            неизвестная роль
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: |
            Больше 5 запросов сброса за час на этот адрес или с этого IP
            (`rate_limited`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: |
            БД не настроена (`external_service_unavailable`) — тот же
            паттерн, что у регистрации
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/auth/password/reset:
    post:
      tags: [identity]
      summary: Сменить пароль по одноразовому токену
      security: []
      description: |
        Публичный роут (без auth). Токен — из письма (на стенде — из
        `reset_url` ответа `reset-request`); живёт 30 минут и гасится
        один раз: повторная отправка формы с тем же токеном → `401`.

        Успех — `204 No Content` без тела. Пароль меняется на Argon2id-хеш
        (тот же, что у регистрации), и ВСЕ refresh-токены субъекта
        отзываются: украденная сессия не переживает смену пароля.

        Неизвестный, уже использованный и просроченный токен дают ОДИН и
        тот же `401 invalid_reset_token` — состояние токена наружу не
        утекает.

        Валидация пароля идёт до погашения токена: `400` не сжигает
        ссылку, и пользователь с опечаткой не запрашивает новую.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Одноразовый токен из ссылки (opaque)
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                  description: Новый пароль (границы — как у регистрации)
      responses:
        "204":
          description: Пароль изменён, refresh-токены субъекта отозваны
        "400":
          description: |
            Ошибка валидации (`validation_failed`): пароль короче 8 или
            длиннее 128 символов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: |
            Токен неизвестен, уже использован или истёк
            (`invalid_reset_token`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: БД не настроена (`external_service_unavailable`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

