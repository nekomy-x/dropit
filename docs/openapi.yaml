      summary: Замена массива стилей DJ-профиля
      description: |
        0..=8 элементов, каждый 2..40 символов. Нормализация: trim +
        lowercase + дедуп со стабильным порядком (первое вхождение).
        DJ не найден → 404 (не раскрывает существование).
      security:
