              properties:
                invite_token: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200": { description: Аккаунт активирован }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/club/djs/{id}:
    patch:
      tags: [club-panel]
      summary: Изменить доступ и/или заметку DJ клуба
      description: |
        Поля независимы и оба необязательны, но хотя бы одно должно быть
        передано:

        * `status` — `active` | `suspended`; допускается только для DJ,
          принявшего приглашение (иначе `409 dj_status_locked`);
        * `note` — строка до 500 символов (`null` очищает заметку).

        Клуб берётся из токена, `club_id` в теле отсутствует. Снятый с
        состава DJ (`removed_at IS NOT NULL`) отвечает `404 dj_not_found` —
        его сначала возвращают через `/restore`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, suspended] }
                note: { type: string, nullable: true, maxLength: 500 }
      responses:
        "200":
          description: Доступ и/или заметка изменены
          content:
            application/json:
              schema:
                type: object
                required: [id, display_name, status]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  status: { type: string }
                  note: { type: string, nullable: true }
        "400":
          description: |
            Пустое тело (ни `status`, ни `note`), неизвестный `status` или
            заметка длиннее 500 символов.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      tags: [club-panel]
      summary: Снять DJ с состава
      description: |
        Мягкое удаление: строка `dj` сохраняется (`removed_at`), потому что
        на неё ссылаются история смен и выплат; доступ блокируется, инвайт
        аннулируется, DJ скрывается из состава и может быть возвращён через
        `POST /v1/club/djs/{id}/restore`.

        Два исключения:

        * DJ, так и не принявший приглашение (нет пароля, нет смен),
          удаляется физически — иначе `UNIQUE(email)` навсегда заблокировал
          бы повторный инвайт на тот же адрес (`deleted: "hard"`);
        * DJ с открытой сменой снять нельзя — `409 dj_on_shift`, сначала
          закрывается смена.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: DJ снят с состава
          content:
            application/json:
              schema:
                type: object
                required: [id, deleted, status]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  deleted: { type: string, enum: [soft, hard] }
                  status: { type: string }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/club/djs/{id}/restore:
    post:
      tags: [club-panel]
      summary: Вернуть DJ в состав
      description: |
        Снимает `removed_at` и восстанавливает доступ (`status = active`).
        Идемпотентно: на DJ, который и так в составе, отвечает 200 с текущим
        состоянием.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: DJ в составе
          content:
            application/json:
              schema:
                type: object
                required: [id, display_name, status, removed]
                properties:
                  id: { type: string, format: uuid }
                  display_name: { type: string }
                  status: { type: string }
                  removed: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /v1/dj/presence:
    post:
      tags: [dj]
      summary: Heartbeat присутствия DJ
      description: |
        DJ-консоль зовёт раз в 30 с, пока вкладка видима; клуб читает
        `last_seen_at` в `GET /v1/club/djs` и считает DJ «в сети», пока
        heartbeat моложе 90 с. Ничего не кешируется и не пишется в
        реальном времени: это одна строка `dj.last_seen_at`.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Присутствие отмечено
          content:
            application/json:
              schema:
                type: object
                required: [last_seen_at, online]
                properties:
                  last_seen_at: { type: string, format: date-time }
                  online: { type: boolean }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/djs/invite:
    post:
      tags: [club-panel]
      summary: Приглашение DJ в клуб
      description: |
        DJ создаётся в статусе invited (без пароля — логин невозможен до
        завершения инвайт-флоу). Одноразовый invite_token (128 бит, hex),
        TTL 7 дней. Повторный инвайт того же e-mail в этот клуб →
        409 dj_already_invited.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name]
              properties:
                email: { type: string, format: email }
                display_name: { type: string, maxLength: 120 }
      responses:
        "201":
          description: DJ приглашён
          content:
            application/json:
              schema:
                type: object
                required: [dj_id, invite_token, invite_expires_at]
                properties:
                  dj_id: { type: string, format: uuid }
                  invite_token: { type: string }
                  invite_expires_at: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/club/payouts:
    get:
