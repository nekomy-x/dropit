  # ==========================================================
  # F5 — payments (Test Mode, МОК-провайдер до ADR-004)
  # ==========================================================
  /v1/requests/{id}/payment:
    post:
      tags: [payments]
      summary: Создание платёж-интента (гость)
      description: |
        Цена — из ДЕЙСТВУЮЩЕГО тарифа клуба (Q6), дефолт 3 €.
        GUARD: request pending + session active. При STRIPE_API_KEY
        используется Stripe; в mock-окружении client_secret фиктивный.
      security:
        - deviceToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: |
            Replay/гонка: для request уже есть активный платёж (не
            cancelled/refunded/failed) — либо повторный вызов с другим
            Idempotency-Key, либо параллельный запрос успел первым.
            Возвращается существующий платёж без создания нового интента.
            Для status=intent исходный client_secret восстанавливается
            чтением того же PaymentIntent у провайдера, только владельцу
            request. Это позволяет продолжить оплату после потери ответа.
            Для остальных статусов client_secret пустой.
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, amount_minor, client_secret, status]
                properties:
                  payment_id: { type: string, format: uuid }
                  request_id: { type: string, format: uuid }
                  amount_minor: { type: integer }
                  currency: { type: string }
                  test_mode: { type: boolean, description: true только для серверного mock-провайдера; карта и Stripe SDK не нужны }
                  client_secret: { type: string, description: Исходный секрет для intent; для остальных статусов пустой }
                  status: { type: string }
        "201":
          description: Интент создан
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, amount_minor, client_secret, status]
                properties:
                  payment_id: { type: string, format: uuid }
                  request_id: { type: string, format: uuid }
                  amount_minor: { type: integer }
                  currency: { type: string }
                  test_mode: { type: boolean, description: true только для серверного mock-провайдера }
                  client_secret: { type: string }
                  status: { type: string, enum: [intent] }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/payments/{id}/test-confirm:
    post:
      tags: [payments]
      summary: Подтверждение тестовой оплаты без списания денег
      description: |
        Только для фактического MockStripe и intent с префиксом pi_mock_.
        При Stripe, включая sandbox-ключи, возвращается 404.
        Проверяются владелец, Idempotency-Key, активность сессии и pending request.
        Применяется обычный цикл confirm → captured, ledger и outbox, без сети
        провайдера и списания денег. Повтор не создаёт вторую проводку.
      security:
        - deviceToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Тестовая оплата завершена, деньги не списывались
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, status, test_mode]
                properties:
                  payment_id: { type: string, format: uuid }
                  status: { type: string, enum: [captured] }
                  test_mode: { type: boolean, enum: [true] }
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/payments/{id}/confirm:
    post:
      tags: [payments]
      summary: Подтверждение оплаты (гость)
      description: |
        GUARD: session == active AND request == pending, иначе 409 +
        авто-cancel интента (не «заплачено за expired»).
        Провайдер — мок до закрытия ADR-004/Q15.
        Безопасность (закрытие IDOR): авторизация — device-token ИЛИ
        гостевой JWT (Bearer), `Idempotency-Key` обязателен. Владение
        платежом — `payment → request → guest_device_id` совпадает с
        субъектом; чужой платёж → 404 `payment_not_found` (существование
        не раскрывается). Повтор тем же Idempotency-Key успешного
        confirm → 200 `processing` (replay) без повторного перехода
        состояния. Неподтверждаемый статус (captured/cancelled/failed/
        refunded) → 409 `conflict`; GUARD-срыв (пауза/закрытие/expired)
        → 409 `session_paused` + авто-cancel интента.
      security:
        - deviceToken: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: string
                  description: Токен платёжного метода (Stripe SDK)
      responses:
        "200":
          description: processing (или replay успешного confirm — без повторного перехода состояния)
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, status]
                properties:
                  payment_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [processing]
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/stripe/webhook:
    post:
      tags: [payments]
      summary: Webhook-intake (захват платежа)
      description: |
        Верификация подписи (tolerance 5 мин; clock-drift — отдельный
        лог). Идемпотентность по (aggregate_id, event_type): дубль
        вебхука с другим event_id — no-op 200, НЕ вторая проводка.
        События захвата: payment_intent.succeeded | charge.succeeded.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, type, payment_id, amount_minor]
              properties:
                event_id:
                  type: string
                type:
                  type: string
                payment_id:
                  type: string
                  format: uuid
                amount_minor:
                  type: integer
      responses:
        "200":
          description: Обработано или no-op (дубль)
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F6 — payouts / reconciliation (Test Mode)
  # ==========================================================
  /v1/admin/payouts/run:
    post:
      tags: [payouts]
      summary: Триггер цикла выплат
      description: |
        Прод: cron пн 10:00 UTC. НЕТТО по КАЖДОМУ payee
        (pending − reversed), порог 10 € (ниже — перенос),
        финальная выплата без порога при блокировке/уходе.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Цикл выполнен
          content:
            application/json:
              schema:
                type: object
                required: [payouts_created, total_minor]
                properties:
                  payouts_created:
                    type: integer
                  total_minor:
                    type: integer
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/admin/payouts:
    get:
      tags: [payouts]
      summary: Выплаты за неделю
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список выплат
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/stripe/transfer-webhook:
    post:
      tags: [payouts]
      summary: Transfer-вебхуки (paid/failed)
      description: |
        Идемпотентно по stripe_transfer_id (event_id меняется между
        доставками). transfer.failed: retry ≤5 → on_hold + инцидент,
        сплиты возвращаются в pending.
        Подпись Stripe обязательна всегда: сырое тело + заголовок
        `Stripe-Signature` → HMAC-SHA256 (tolerance 5 мин). Невалидная,
        просроченная или отсутствующая подпись → 400
        `webhook_signature_invalid`, состояние выплаты не меняется и
        событие не пишется в `webhook_event`. Формат тела — событие
        Stripe (`{id, type, data:{object:{id, failure_message?}}}`);
        legacy-формат `{type, transfer_id, reason?}` также поддержан
        (fallback после проверки подписи).
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Событие Stripe
                  required: [id, type]
                  properties:
                    id:
                      type: string
                      description: event_id (логируется, не ключ идемпотентности)
                    type:
                      type: string
                      enum: [transfer.paid, transfer.failed]
                    data:
                      type: object
                      required: [object]
                      properties:
                        object:
                          type: object
                          required: [id]
                          properties:
                            id:
                              type: string
                              description: transfer_id (tr_…)
                            failure_message:
                              type: string
                              description: Причина провала (transfer.failed)
                - type: object
                  description: Legacy-формат (подпись обязательна)
                  required: [type]
                  properties:
                    event_id:
                      type: string
                    type:
                      type: string
                      enum: [transfer.paid, transfer.failed]
                    transfer_id:
                      type: string
                    reason:
                      type: string
      responses:
        "200":
          description: Обработано или no-op (дубль)
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/reconciliation/run:
    post:
      tags: [payouts]
      summary: "Триггер сверки (cron 05:00 в проде)"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Прогон создан
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [ok, discrepancies, running, failed]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/admin/reconciliation-runs:
    get:
      tags: [payouts]
      summary: История прогонов сверки
      description: |
        Курсорная пагинация keyset по (created_at DESC, id DESC). Пустая
        история — валидный ответ (items: []). Статус БД маппится в
        ok|mismatch|failed; discrepancy_minor = actual_minor − expected_minor.
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Список прогонов
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, period_start, period_end, status, expected_minor, actual_minor, discrepancy_minor, created_at]
                      properties:
                        id: { type: string, format: uuid }
                        period_start: { type: string, format: date-time }
                        period_end: { type: string, format: date-time }
                        status: { type: string, enum: [ok, mismatch, failed] }
                        expected_minor: { type: integer }
                        actual_minor: { type: integer }
                        discrepancy_minor: { type: integer }
                        created_at: { type: string, format: date-time }
                  next_cursor:
                    anyOf: [{ type: string }, { type: "null" }]
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

