  # ==========================================================
  # F2 — sessions / QR / join
  # ==========================================================
  /v1/sessions/join:
    post:
      tags: [sessions]
      summary: Скан QR гостем → session info + грант
      description: |
        Активный QR-токен → информация о сессии (клуб, DJ, статус,
        цена!) + ГРАНТ session_guest. Грант обязателен для
        POST /requests (F4): клиентский session_id на веру не
        принимается. Повторный join = re-grant, не дубль.
        QR ротируется на сессию: старый токен → 404.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token:
                  type: string
                  minLength: 64
                  description: 128 бит, hex
      responses:
        "200":
          description: Session info + grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/sessions/current:
    get:
      tags: [sessions]
      summary: Текущая открытая сессия гостя
      description: |
        Последняя активная (active/paused_acceptance) сессия клуба, где у
        гостя есть действующий join-грант (не отозван, сессия не закрыта).
        Нет таковой → 404 session_not_found (нормальный ответ, не ошибка).
        Авторизация двойная: device-token (UUIDv7 в Bearer, как в /sessions/join)
        ИЛИ JWT с ролью guest; чужая роль → 403, без/битый токен → 401,
        неизвестное устройство → 401.
      security:
        - deviceToken: []
        - bearerAuth: []
      responses:
        "200":
          description: Текущая сессия гостя
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSessionEnvelope"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/club/sessions:
    post:
      tags: [sessions]
      summary: Клуб открывает смену (сессию)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                dj_id:
                  type: string
                  format: uuid
                pricing_policy_id:
                  type: string
                  format: uuid
                timezone:
                  type: string
                  description: IANA-зона (DST-безопасное авто-закрытие)
                  examples: [Europe/Madrid]
      responses:
        "201":
          description: Сессия создана (status=created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/qr/generate:
    post:
      tags: [sessions]
      summary: QR-ротация сессии
      description: |
        Старый токен деактивируется, новый (128 бит) выдаётся
        ОДИН раз в ответе. expires_at = плановое авто-закрытие
        (следующий 07:00 в IANA-зоне клуба).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Новый QR-токен
          content:
            application/json:
              schema:
                type: object
                required: [session_id, qr_token, expires_at]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  qr_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/qr/activate:
    post:
      tags: [sessions]
      summary: Активировать QR-токен сессии
      description: |
        Включает приём гостей по QR-токену сессии. Идемпотентен: если у
        сессии уже есть рабочий (активный, не истёкший) QR-токен —
        отвечает `200 { qr_active: true }` БЕЗ повторного выпуска (тот
        же токен остаётся в БД, дублирования нет). Если рабочего токена
        нет — выпускается новый (256 бит, sha256-хеш в БД), plain
        `qr_token` и `expires_at` возвращаются ОДИН раз (как в
        `/qr/generate`). RBAC: только владелец клуба; чужая сессия →
        404, чужая роль → 403, без токена → 401.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: QR активирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrToggleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/qr/deactivate:
    post:
      tags: [sessions]
      summary: Деактивировать QR-токен сессии
      description: |
        Приостанавливает приём гостей по QR-токену сессии: все активные
        токены помечаются `active=FALSE`. Уже выданные гранты гостей
        (`session_guest`) НЕ отзываются — вошедший по QR гость сохраняет
        доступ до планового закрытия сессии; блокируется только НОВЫЙ
        вход по этому QR (`/sessions/join` → 404). Идемпотентен:
        повторный deactivate при отсутствии активного токена — `200`
        без изменений. RBAC: только владелец клуба; чужая сессия → 404.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: QR деактивирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrToggleResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/close:
    patch:
      tags: [sessions]
      summary: Закрыть смену
      description: pending-запросы гаснут в expired (F4-воркер).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сессия закрыта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/sessions/{id}/open:
    post:
      tags: [sessions]
      summary: DJ открывает приём запросов
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сессия active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/sessions/{id}/echo:
    get:
      tags: [sessions]
      summary: Эхо сессии (DJ)
      description: "Диагностический роут: возвращает session_id и роль из JWT."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Эхо
          content:
            application/json:
              schema:
                type: object
                required: [session_id, role]
                properties:
                  session_id: { type: string, format: uuid }
                  role: { type: string }
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F4 — requests / queue / ws-ticket
  # ==========================================================
  /v1/requests:
    post:
      tags: [requests]
      summary: Запрос трека (гость)
      description: |
        Гейты: живой session_guest-грант + session.status == active
        (клиентский session_id на веру НЕ принимается). Пауза → 409
        session_paused. Idempotency-Key обязателен: дубль → replay
        сохранённого ответа (не второй запрос). F4 — без денег
        (price 0); F5 обернёт в payment intent.
      security:
        - deviceToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id:
                  type: string
                  format: uuid
                  description: track_cache.id (серверно-валидированный, F3)
                style:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: Запрос создан (или replay дубля)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, session_id]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending]
                  session_id:
                    type: string
                    format: uuid
                  queue_position:
                    anyOf:
                      - type: integer
                      - type: "null"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/my/requests:
    get:
      tags: [requests]
      summary: Запросы гостя (история + статусы)
      security:
        - deviceToken: []
      responses:
        "200":
          description: Список запросов гостя в активной сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/my/requests/{id}:
    get:
      tags: [requests]
      summary: Карточка заявки гостя
      description: |
        Заявка ищется в активной сессии гостя; чужая или из другой
        сессии → 404 request_not_found (без раскрытия существования).
        position — только для pending, иначе null.
      security:
        - deviceToken: []
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Деталь заявки
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyRequestDetail"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/guest/upgrade:
    post:
      tags: [guest]
      summary: Привязка e-mail к гостевому профилю
      description: |
        Идемпотентна: повторный вызов с тем же e-mail → 200 already_upgraded.
        Занятый другим гостем e-mail → 409 email_taken. Невалидный → 400.
      security:
        - deviceToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: E-mail привязан (или уже был)
          content:
            application/json:
              schema:
                type: object
                required: [email, verified, already_upgraded]
                properties:
                  email: { type: string }
                  verified: { type: boolean }
                  already_upgraded: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/guest/verify:
    post:
      tags: [guest]
      summary: Подтверждение e-mail кодом из письма
      description: |
        Код приходит письмом `guest_verify` после `POST /v1/guest/upgrade`
        (ADR-008). Успех выставляет `guest_account.verified = TRUE`; код
        одноразовый и живёт 15 минут.

        Перебор ограничен: пять неверных попыток гасят код, после чего
        нужен новый (повторный апгрейд). Сравнение — по SHA-256 от
        `"{account_id}:{code}"`, сам код в БД не хранится.
      security:
        - deviceToken: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: Шестизначный код из письма
                  pattern: "^[0-9]{6}$"
      responses:
        "200":
          description: Адрес подтверждён
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: { type: boolean }
        "401":
          $ref: "#/components/responses/Error"
        "410":
          description: |
            `code_expired` — код неизвестен, просрочен или погашен
            исчерпанием попыток.
          $ref: "#/components/responses/Error"
        "422":
          description: |
            `invalid_code` — код не совпал; в `details.attempts_left`
            остаток попыток.
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/queue:
    get:
      tags: [requests]
      summary: Очередь запросов DJ
      description: |
        sort=new — по времени; sort=hot — по счётчику той же песни
        (canonical-ключ source:source_id), затем по времени.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, hot]
            default: new
      responses:
        "200":
          description: Активные запросы (pending/accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/accept:
    post:
      tags: [requests]
      summary: DJ принимает запрос
      description: Дубль accept на accepted — no-op (200, noop=true), не 500.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос accepted (или no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/reject:
    post:
      tags: [requests]
      summary: DJ отклоняет запрос
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Запрос rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/played:
    post:
      tags: [requests]
      summary: DJ отметил сыгранным
      description: |
        Разрешён из pending (DJ сыграл, не нажав accept) и из accepted.
        Дубль played — no-op. accept после played → 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/dj/acceptance/pause:
    post:
      tags: [requests]
      summary: Пауза приёма запросов
      description: Блокирует POST /v1/requests (409 session_paused).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: paused_acceptance
        "401":
