      summary: Поиск трека во внешнем каталоге
      description: |
        Кеш (catalog_query_cache) → внешний каталог (iTunes/Deezer) →
        upsert в track_cache. q 2..80 символов, limit 1..=25 (по
        умолчанию 10). Внешний каталог недоступен → 503
        catalog_unavailable. Авторизация — JWT гостя (RBAC-гейт role=guest).
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 80 }
        - name: style
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 25, default: 10 }
      responses:
        "200":
          description: Найденные треки
          content:
            application/json:
              schema:
                type: object
                required: [items, cached]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/CatalogHit" }
                  cached: { type: boolean }
        "400":
          $ref: "#/components/responses/Error"
        "401":
