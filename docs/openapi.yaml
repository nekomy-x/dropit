  /v1/catalog/search:
    get:
      tags: [catalog]
      summary: Поиск трека во внешнем каталоге
      description: |
        Кеш (catalog_query_cache) → внешний каталог (iTunes/Deezer) →
        upsert в track_cache. q 2..80 символов, limit 1..=25 (по
        умолчанию 10). Внешний каталог недоступен → 503
        catalog_unavailable.

        Авторизация проверяется в хендлере и принимает ровно два
        удостоверения: JWT роли `guest` или выданный сервером device-token
        (`Bearer <uuid>`, строка в `guest_device`) — мобильному гостю JWT не
        выдаётся. Иные роли → 403, без токена/неизвестный device-token → 401.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
