openapi: 3.1.0
info:
  title: DROP IT API
  version: 0.5.0
  description: |
    Контракт (F0A → F2). Реальные пути добавляются по фазам:
    F1 ✅, F2 ✅, F4 ✅, F5 payments ✅, F6 payouts/reconciliation (Test Mode) ✅, F3 — catalog,
    F5 — payments. Breaking changes блокируются CI (oasdiff).
  contact:
    name: DROP IT
servers:
  - url: http://127.0.0.1:8080
    description: local dev
paths:
  /healthz:
    get:
      summary: Liveness
      security: []
      responses:
        "200":
          description: Процесс жив
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      summary: Readiness
      security: []
      responses:
        "200":
          description: Готов принимать трафик
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  # ==========================================================
  # F1 — identity
  # ==========================================================
  /v1/guest/device:
    post:
      summary: Выдать device-token гостя
      security: []
      description: |
        Без регистрации. Лимит 5/час/IP; выше — captcha (F8).
        Device-token = UUIDv7 guest_device.id; передаётся как Bearer
        в гостевых роутах (не JWT).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform:
                  type: string
                  enum: [ios, android, web]
                app_version:
                  type: string
      responses:
        "200":
          description: Device-token выдан
          content:
            application/json:
              schema:
                type: object
                required: [device_token]
                properties:
                  device_token:
                    type: string
                    format: uuid
        "429":
          $ref: "#/components/responses/Error"

  /v1/auth/{role}/login:
    post:
      summary: Логин DJ/клуба/админа (шаг 1 — пароль)
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [dj, club, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: |
            Либо пара токенов (2FA не настроена), либо требование 2FA.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TokenPair"
                  - $ref: "#/components/schemas/TotpChallenge"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"

  /v1/auth/{role}/2fa:
    post:
      summary: Логин (шаг 2 — TOTP-код)
      security: []
      parameters:
        - name: role
          in: path
          required: true
          schema:
            type: string
            enum: [dj, club, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, totp_code]
              properties:
                email:
                  type: string
                  format: email
                totp_code:
                  type: string
                  pattern: '^\d{6}$'
      responses:
        "200":
          description: Пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  /v1/auth/refresh:
    post:
      summary: Ротация refresh-токена
      security: []
      description: |
        Каждый refresh аннулирует предыдущий токен (семья).
        Reuse отозванного токена = кража → ревок всей семьи.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        "200":
          description: Новая пара токенов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F2 — sessions / QR / join
  # ==========================================================
  /v1/sessions/join:
    post:
      summary: Скан QR гостем → session info + грант
      description: |
        Активный QR-токен → информация о сессии (клуб, DJ, статус,
        цена!) + ГРАНТ session_guest. Грант обязателен для
        POST /requests (F4): клиентский session_id на веру не
        принимается. Повторный join = re-grant, не дубль.
        QR ротируется на сессию: старый токен → 404.
      security:
        - deviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qr_token]
              properties:
                qr_token:
                  type: string
                  minLength: 64
                  description: 128 бит, hex
      responses:
        "200":
          description: Session info + grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/club/sessions:
    post:
      summary: Клуб открывает смену (сессию)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timezone]
              properties:
                dj_id:
                  type: string
                  format: uuid
                pricing_policy_id:
                  type: string
                  format: uuid
                timezone:
                  type: string
                  description: IANA-зона (DST-безопасное авто-закрытие)
                  examples: [Europe/Madrid]
      responses:
        "201":
          description: Сессия создана (status=created)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "403":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/qr/generate:
    post:
      summary: QR-ротация сессии
      description: |
        Старый токен деактивируется, новый (128 бит) выдаётся
        ОДИН раз в ответе. expires_at = плановое авто-закрытие
        (следующий 07:00 в IANA-зоне клуба).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Новый QR-токен
          content:
            application/json:
              schema:
                type: object
                required: [session_id, qr_token, expires_at]
                properties:
                  session_id:
                    type: string
                    format: uuid
                  qr_token:
                    type: string
                  expires_at:
                    type: string
                    format: date-time
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/club/sessions/{id}/close:
    patch:
      summary: Закрыть смену
      description: pending-запросы гаснут в expired (F4-воркер).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сессия закрыта
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/dj/sessions/{id}/open:
    post:
      summary: DJ открывает приём запросов
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Сессия active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F4 — requests / queue / ws-ticket
  # ==========================================================
  /v1/requests:
    post:
      summary: Запрос трека (гость)
      description: |
        Гейты: живой session_guest-грант + session.status == active
        (клиентский session_id на веру НЕ принимается). Пауза → 409
        session_paused. Idempotency-Key обязателен: дубль → replay
        сохранённого ответа (не второй запрос). F4 — без денег
        (price 0); F5 обернёт в payment intent.
      security:
        - deviceToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [track_id]
              properties:
                track_id:
                  type: string
                  format: uuid
                  description: track_cache.id (серверно-валидированный, F3)
                style:
                  type: string
                  maxLength: 64
      responses:
        "201":
          description: Запрос создан (или replay дубля)
          content:
            application/json:
              schema:
                type: object
                required: [request_id, status, session_id]
                properties:
                  request_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [pending]
                  session_id:
                    type: string
                    format: uuid
                  queue_position:
                    anyOf:
                      - type: integer
                      - type: "null"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "422":
          $ref: "#/components/responses/Error"

  /v1/my/requests:
    get:
      summary: Запросы гостя (история + статусы)
      security:
        - deviceToken: []
      responses:
        "200":
          description: Список запросов гостя в активной сессии
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"

  /v1/dj/queue:
    get:
      summary: Очередь запросов DJ
      description: |
        sort=new — по времени; sort=hot — по счётчику той же песни
        (canonical-ключ source:source_id), затем по времени.
      security:
        - bearerAuth: []
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [new, hot]
            default: new
      responses:
        "200":
          description: Активные запросы (pending/accepted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueResponse"

  /v1/dj/requests/{id}/accept:
    post:
      summary: DJ принимает запрос
      description: Дубль accept на accepted — no-op (200, noop=true), не 500.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос accepted (или no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"
        "409":
          $ref: "#/components/responses/Error"

  /v1/dj/requests/{id}/reject:
    post:
      summary: DJ отклоняет запрос
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Запрос rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /v1/dj/requests/{id}/played:
    post:
      summary: DJ отметил сыгранным
      description: |
        Разрешён из pending (DJ сыграл, не нажав accept) и из accepted.
        Дубль played — no-op. accept после played → 409.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Запрос played
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResult"

  /v1/dj/acceptance/pause:
    post:
      summary: Пауза приёма запросов
      description: Блокирует POST /v1/requests (409 session_paused).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: paused_acceptance
        "409":
          $ref: "#/components/responses/Error"

  /v1/dj/acceptance/resume:
    post:
      summary: Возобновить приём
      security:
        - bearerAuth: []
      responses:
        "200":
          description: active

  /v1/ws/ticket:
    post:
      summary: Одноразовый билет WS (TTL 30 с)
      description: |
        JWT в query НЕ передаётся (утечки в логи Cloudflare/Loki).
        Билет одноразовый, передаётся в Sec-WebSocket-Protocol.
      security:
        - bearerAuth: []
        - deviceToken: []
      responses:
        "200":
          description: Билет выдан
          content:
            application/json:
              schema:
                type: object
                required: [ticket, expires_in]
                properties:
                  ticket:
                    type: string
                  expires_in:
                    type: integer
                    enum: [30]

  # ==========================================================
  # F5 — payments (Test Mode, МОК-провайдер до ADR-004)
  # ==========================================================
  /v1/payments/{id}/confirm:
    post:
      summary: Подтверждение оплаты (гость)
      description: |
        GUARD: session == active AND request == pending, иначе 409 +
        авто-cancel интента (не «заплачено за expired»).
        Провайдер — мок до закрытия ADR-004/Q15.
      security:
        - deviceToken: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_method:
                  type: string
                  description: Токен платёжного метода (Stripe SDK)
      responses:
        "200":
          description: processing
          content:
            application/json:
              schema:
                type: object
                required: [payment_id, status]
                properties:
                  payment_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [processing]
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/stripe/webhook:
    post:
      summary: Webhook-intake (захват платежа)
      description: |
        Верификация подписи (tolerance 5 мин; clock-drift — отдельный
        лог). Идемпотентность по (aggregate_id, event_type): дубль
        вебхука с другим event_id — no-op 200, НЕ вторая проводка.
        События захвата: payment_intent.succeeded | charge.succeeded.
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event_id, type, payment_id, amount_minor]
              properties:
                event_id:
                  type: string
                type:
                  type: string
                payment_id:
                  type: string
                  format: uuid
                amount_minor:
                  type: integer
      responses:
        "200":
          description: Обработано или no-op (дубль)
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  # ==========================================================
  # F6 — payouts / reconciliation (Test Mode)
  # ==========================================================
  /v1/admin/payouts/run:
    post:
      summary: Триггер цикла выплат
      description: |
        Прод: cron пн 10:00 UTC. НЕТТО по КАЖДОМУ payee
        (pending − reversed), порог 10 € (ниже — перенос),
        финальная выплата без порога при блокировке/уходе.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Цикл выполнен
          content:
            application/json:
              schema:
                type: object
                required: [payouts_created, total_minor]
                properties:
                  payouts_created:
                    type: integer
                  total_minor:
                    type: integer
        "403":
          $ref: "#/components/responses/Error"

  /v1/admin/payouts:
    get:
      summary: Выплаты за неделю
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список выплат
        "403":
          $ref: "#/components/responses/Error"

  /v1/stripe/transfer-webhook:
    post:
      summary: Transfer-вебхуки (paid/failed)
      description: |
        Идемпотентно по stripe_transfer_id (event_id меняется между
        доставками). transfer.failed: retry ≤5 → on_hold + инцидент,
        сплиты возвращаются в pending.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, transfer_id]
              properties:
                event_id:
                  type: string
                type:
                  type: string
                  enum: [transfer.paid, transfer.failed]
                transfer_id:
                  type: string
                reason:
                  type: string
      responses:
        "200":
          description: Обработано или no-op (дубль)
        "404":
          $ref: "#/components/responses/Error"

  /v1/admin/reconciliation/run:
    post:
      summary: "Триггер сверки (cron 05:00 в проде)"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Прогон создан
          content:
            application/json:
              schema:
                type: object
                required: [run_id, status]
                properties:
                  run_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum: [ok, discrepancies, running, failed]

  /v1/admin/incidents:
    get:
      summary: Открытые инциденты
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Список

  /v1/admin/incidents/{id}/resolve:
    post:
      summary: Разобрать инцидент
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Закрыт
        "404":
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: access-JWT (15 мин), role в клеймах
    deviceToken:
      type: http
      scheme: bearer
      description: device-token гостя (UUIDv7, не JWT)
  schemas:
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
      required: [status]
    ErrorEnvelope:
      type: object
      description: Единый формат ошибок; code — стабильный i18n-ключ
      properties:
        code:
          type: string
          examples: [session_closed, rate_limited, forbidden]
        message:
          type: string
        details:
          description: Опциональные детали
      required: [code, message]
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: TTL access-токена, сек
      required: [access_token, refresh_token, token_type, expires_in]
    TotpChallenge:
      type: object
      properties:
        mfa_required:
          type: boolean
          enum: [true]
      required: [mfa_required]
    JoinResponse:
      type: object
      description: Ответ /v1/sessions/join
      properties:
        session_id:
          type: string
          format: uuid
        club_name:
          type: string
        dj_display_name:
          type: string
          description: null до назначения DJ
        status:
          type: string
          enum: [created, active, paused_acceptance]
        timezone:
          type: string
        price_minor:
          type: integer
          description: Цена запроса из действующей политики (минорные единицы)
        grant_id:
          type: string
          format: uuid
          description: Грант session_guest; основание для POST /requests (F4)
      required: [session_id, club_name, status, timezone, grant_id]
    QueueResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
      required: [items]
    QueueItem:
      type: object
      description: Карточка запроса в очереди DJ / списке гостя
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, accepted, rejected, played, expired]
        style:
          anyOf:
            - type: string
            - type: "null"
        created_at:
          type: string
          format: date-time
        title:
          type: string
        artist:
          type: string
        cover_url:
          anyOf:
            - type: string
            - type: "null"
        preview_url:
          anyOf:
            - type: string
            - type: "null"
        isrc:
          anyOf:
            - type: string
            - type: "null"
        same_track_count:
          type: integer
          description: Сколько раз эту же песню (canonical-ключ) запросили в сессии
      required: [id, status, created_at, title, artist, same_track_count]
    ActionResult:
      type: object
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
        noop:
          type: boolean
          description: true — повтор действия уже выполненного (no-op)
      required: [request_id, status, noop]
    SessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, active, paused_acceptance, closed]
        timezone:
          type: string
        dj_id:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required: [id, status, timezone]
  responses:
    Error:
      description: Ошибка с единым envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
