                        presence_age_seconds: { type: integer, nullable: true }
                        online: { type: boolean }
                        on_shift: { type: boolean }
                        open_session_id: { type: string, format: uuid, nullable: true }
                        removed: { type: boolean }
                        removed_at: { type: string, format: date-time, nullable: true }
                        invite_expires_at: { type: string, format: date-time, nullable: true }
                        has_password: { type: boolean }
                        created_at: { type: string, format: date-time }
