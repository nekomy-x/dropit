        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /v1/admin/djs:
    get:
      tags: [admin-panel]
      summary: Диджеи (админ)
      description: |
        Все DJ платформы. Поля: `id`, `display_name`, `email`, `club_id`,
        `club_name`, `status`, `stripe_account_id`,
        `stripe_onboarding_status`, `created_at`, `removed`.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Список }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin-panel]
      summary: Приглашение DJ админом
      description: |
        Та же механика, что `POST /v1/club/djs/invite`, но клуб выбирает
        админ. DJ создаётся в статусе `invited` с одноразовым invite-токеном
        (в БД только sha256, TTL), письмо `dj_invite` ставится в очередь.
        Неизвестный клуб → 404 `club_not_found`; занятый e-mail → 409
        `email_taken`.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
