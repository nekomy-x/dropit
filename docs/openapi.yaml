      description: |
        Значения задаёт владелец (Q11); код проверяет только
        диапазоны. clear_* флаги сбрасывают поля в NULL.

        `runtime_mode` — режим эксплуатации стенда (test / maintenance /
        normal), который читает публичный `GET /v1/status` для нижнего
